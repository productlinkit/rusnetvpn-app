<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>RusnetVPN · Splash C</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E11D2E;--red-d:#9B1220;--grad:linear-gradient(135deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);--ink:#17121A;--sub:#6B5E63}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#EDE7E8;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.ph{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;cursor:pointer;box-shadow:0 40px 80px -40px rgba(60,10,15,.45),0 0 0 1px rgba(23,18,26,.06);background:radial-gradient(80% 45% at 50% 44%,rgba(255,138,128,.3),transparent 70%),linear-gradient(180deg,#FFFFFF 0%,#FFF6F4 55%,#FFE0DB 100%)}
@media (max-width:430px){body{background:#fff;align-items:stretch}.ph{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* ripples behind the logo */
.rip{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(225,29,46,.35);opacity:0;animation:rip 2.4s cubic-bezier(.2,.7,.3,1) .9s infinite}
.rip.r2{animation-delay:1.7s}
@keyframes rip{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(2.6)}}
/* glossy orb logo */
.logo{position:relative;width:150px;height:150px;margin-top:-80px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 34% 26%,#FFB1A8 0%,#FF5A4E 22%,#E11D2E 52%,#9B1220 82%,#6E0A14 100%);box-shadow:inset 0 -16px 34px rgba(60,5,10,.45),inset 0 10px 22px rgba(255,255,255,.35),0 40px 60px -26px rgba(155,18,32,.85);animation:orbIn .9s cubic-bezier(.2,.9,.3,1.3) both}
.logo:before{content:"";position:absolute;left:22%;top:9%;width:48%;height:24%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0))}
.logo .sh{position:relative;width:72px;height:auto;filter:drop-shadow(0 6px 10px rgba(60,5,10,.35))}
.sh{fill:#fff;transform-origin:50% 50%;animation:shIn .6s cubic-bezier(.2,.9,.3,1.4) .45s both}
.ck{fill:none;stroke:var(--red);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:draw .5s cubic-bezier(.6,0,.2,1) 1s forwards}
.halo{position:absolute;inset:-18px;border-radius:50%;background:conic-gradient(from 0deg,rgba(225,29,46,0),rgba(225,29,46,.6),rgba(255,138,128,.1),rgba(225,29,46,0));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));animation:fade .5s ease 1.1s both,spin 1.6s linear 1.1s infinite}
.shadow{width:120px;height:20px;margin-top:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(122,13,23,.3),transparent);animation:fade .8s ease .4s both}
.word{margin:30px 0 0;overflow:hidden;line-height:0}
.word img{height:34px;width:auto;animation:wipe .8s cubic-bezier(.6,0,.2,1) 1.35s both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);transform:translateY(40%)}}
.word span{display:inline-block;animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.word span:nth-child(1){animation-delay:1.35s}
.word b{display:inline-block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .7s cubic-bezier(.2,.8,.2,1) 1.5s both}
.tag{margin:8px 0 0;font-size:14px;font-weight:500;color:var(--sub);animation:fade .6s ease 1.9s both}
.load{position:absolute;left:50%;bottom:70px;width:120px;height:4px;margin-left:-60px;border-radius:9px;background:rgba(155,18,32,.12);overflow:hidden;animation:fade .4s ease 1.9s both}
.load i{display:block;height:100%;width:0;border-radius:9px;background:var(--grad);animation:bar 1.2s cubic-bezier(.5,0,.3,1) 2s forwards}
.ver{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-size:11px;font-weight:500;color:#B9AEB2;animation:fade .6s ease 2s both}
.ph.leave .stage{animation:out .45s ease-in forwards}
@keyframes orbIn{from{opacity:0;transform:scale(.3)}}
@keyframes shIn{from{opacity:0;transform:scale(.4) rotate(-12deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(110%)}}
@keyframes bar{to{width:100%}}
@keyframes out{to{opacity:0;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}.rip{display:none}}
</style>
</head>
<body>
<div class="ph" id="ph" role="img" aria-label="RusnetVPN is starting">
  <div class="stage" id="stage">
    <div class="logo"><span class="rip"></span><span class="rip r2"></span><span class="halo"></span>
      <img class="sh" src="../img/rusnet-mark-white.png" alt="">
    </div>
    <div class="shadow"></div>
    <p class="word"><img src="../img/rusnet-wordmark-light.png" alt="RusnetVPN"></p>
    <p class="tag">Private. Fast. One tap away.</p>
    <span class="load"><i></i></span>
    <span class="ver">Version 1.2.0</span>
  </div>
</div>
<script>
// Goes to the welcome screen when loading finishes. Add ?stay to keep it here; tap to replay.
const ph=document.getElementById('ph'),stay=location.search.includes('stay');
let t;const run=()=>{clearTimeout(t);ph.classList.remove('leave');const s=document.getElementById('stage'),c=s.cloneNode(true);s.replaceWith(c);
  if(!stay)t=setTimeout(()=>{ph.classList.add('leave');setTimeout(()=>location.href='WelcomeC.html',450)},3400)};
ph.addEventListener('click',run);run();
</script>
</body>
</html>
