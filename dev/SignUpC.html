<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RusnetVPN · Sign Up C</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E11D2E;--red-t:#C70F21;--grad:linear-gradient(115deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);--ink:#17121A;--sub:#6B5E63;--line:#E8D9DB;--err:#C70F21}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#EDE7E8;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.ph{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 40px 80px -40px rgba(60,10,15,.45),0 0 0 1px rgba(23,18,26,.06)}
@media (max-width:430px){body{background:#fff;align-items:stretch}.ph{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid #B3121F;outline-offset:3px}
a{color:var(--red-t);text-decoration:none;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:40px 24px 32px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.scroll>*:nth-child(2){animation-delay:.04s}.scroll>*:nth-child(3){animation-delay:.08s}.scroll>*:nth-child(n+4){animation-delay:.12s}
.logo{display:block;height:33px;width:auto;margin-left:4px}
h1{margin:36px 0 0;font-size:29px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.lead{margin:10px 0 0;font-size:15px;color:var(--sub)}
form{margin-top:30px}
.f{margin-bottom:18px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:9px}
.in{position:relative;display:flex;align-items:center;height:52px;border:1px solid var(--line);border-radius:18px;background:#fff;transition:border-color .2s,box-shadow .2s}
.in:focus-within{border-color:var(--red);box-shadow:0 0 0 4px rgba(225,29,46,.1)}
.in input{flex:1;height:100%;min-width:0;border:0;background:none;outline:none;padding:0 16px;font-size:15px}
.in input::placeholder{color:#8A7F84}
.in .eye{width:48px;height:48px;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center}
.f.bad .in{border-color:var(--err);animation:shake .35s}
.hint{margin:9px 0 0;font-size:12.5px;color:var(--sub)}
.f.bad .hint{color:var(--err)}
.f.good .hint{color:#15803D}
.terms{margin:4px 0 18px;font-size:12.5px;line-height:1.5;color:var(--sub)}
.btn{position:relative;width:100%;height:54px;border:0;border-radius:20px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.p{background:var(--grad);color:#fff;box-shadow:0 16px 26px -16px rgba(179,18,31,.9)}
.btn.p:active{transform:scale(.98)}
.btn.o{background:#fff;border:1px solid var(--line);margin-top:12px}
.btn.o.red{color:var(--red-t)}
.btn .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
.or{display:flex;align-items:center;gap:12px;margin:22px 0 10px;font-size:13px;color:var(--sub)}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.foot{margin:24px 0 0;text-align:center;font-size:14px;color:var(--sub)}
.foot a{font-weight:700;margin-left:6px}
.toast{position:absolute;left:50%;top:24px;z-index:6;padding:11px 16px;border-radius:999px;background:#1C171D;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;transform:translate(-50%,-10px);opacity:0;pointer-events:none;transition:.3s}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ph">
<div class="scroll">
  <img class="logo" src="../img/rusnet-logo-light.png" alt="RusnetVPN">
  <h1>Create your account</h1>
  <p class="lead">Join RusnetVPN for a more private connection.</p>
  <form id="form" novalidate>
    <div class="f" id="fName"><label for="name">Full name</label><div class="in"><input id="name" autocomplete="name" placeholder="Enter your full name"></div><p class="hint" hidden></p></div>
    <div class="f" id="fEmail"><label for="email">Email</label><div class="in"><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Enter your email"></div><p class="hint" hidden></p></div>
    <div class="f" id="fPw"><label for="pw">Password</label><div class="in"><input id="pw" type="password" autocomplete="new-password" placeholder="Create a password"><button type="button" class="eye" id="eye" aria-label="Show password"></button></div><p class="hint">At least 8 characters</p></div>
    <p class="terms">By creating an account, you agree to our <a>Terms of Service</a> and <a>Privacy Policy</a>.</p>
    <button class="btn p" id="submit" type="submit">Sign Up</button>
  </form>
  <div class="or">or</div>
  <button class="btn o" id="google"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.3h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.4z"/><path fill="#34A853" d="M12 23.5c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3A11.5 11.5 0 0 0 12 23.5z"/><path fill="#FBBC05" d="M5.6 14.2a6.9 6.9 0 0 1 0-4.4v-3H1.8a11.5 11.5 0 0 0 0 10.4z"/><path fill="#EA4335" d="M12 5.1c1.7 0 3.2.6 4.4 1.7l3.3-3.3A11.5 11.5 0 0 0 1.8 6.8l3.8 3C6.5 7.1 9 5.1 12 5.1z"/></svg>Continue with Google</button>
  <button class="btn o red" id="guest">Continue as Guest</button>
  <p class="foot">Already have an account?<a id="login">Log In</a></p>
</div>
<div class="toast" id="toast" role="status"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const EYE={off:'<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',on:'<svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 22 12a16 16 0 0 1-3 3.6M6.6 6.6A16 16 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'};
let tt;const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1600)};
const go=(u,d=0)=>setTimeout(()=>location.href=u,d);

// Coming back from "Change email" keeps what was typed
const q=new URLSearchParams(location.search);
if(q.get('email')){$('email').value=q.get('email');if(q.get('name'))$('name').value=q.get('name');setTimeout(()=>{$('email').focus();$('email').select()},400)}

$('eye').innerHTML=EYE.off;
$('eye').addEventListener('click',()=>{const p=$('pw'),show=p.type==='password';p.type=show?'text':'password';$('eye').innerHTML=show?EYE.on:EYE.off;$('eye').setAttribute('aria-label',show?'Hide password':'Show password')});

const rules={
  fName:()=>$('name').value.trim().length>=2||'Please enter your full name',
  fEmail:()=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test($('email').value.trim())||'Please enter a valid email address',
  fPw:()=>$('pw').value.length>=8||'Password must be at least 8 characters'};
const check=(id,loud)=>{const r=rules[id](),f=$(id),h=f.querySelector('.hint');
  f.classList.remove('bad');if(r!==true&&loud){void f.offsetWidth;f.classList.add('bad');h.hidden=false;h.textContent=r}
  else if(id==='fPw'){h.textContent='At least 8 characters';f.classList.toggle('good',r===true)}
  else h.hidden=true;
  return r===true};
['name','email','pw'].forEach((k,n)=>$(k).addEventListener('input',()=>{const id=['fName','fEmail','fPw'][n];if($(id).classList.contains('bad')||id==='fPw')check(id,$(id).classList.contains('bad'))}));

let busy=false;
$('form').addEventListener('submit',e=>{e.preventDefault();if(busy)return;
  const ok=['fName','fEmail','fPw'].map(id=>check(id,true)).every(Boolean);
  if(!ok){document.querySelector('.f.bad input').focus();return}
  busy=true;$('submit').innerHTML='<span class="spin"></span>';$('submit').setAttribute('aria-label','Creating account');
  go(`CheckEmailC.html?email=${encodeURIComponent($('email').value.trim())}&name=${encodeURIComponent($('name').value.trim())}`,900)});
$('google').addEventListener('click',()=>{toast('Signing in with Google (contoh)');go('HomeC.html',900)});
$('guest').addEventListener('click',()=>go('HomeC.html'));
$('login').addEventListener('click',()=>toast('Log in screen (contoh)'));
document.querySelectorAll('.terms a').forEach(a=>a.addEventListener('click',()=>toast(a.textContent+' (contoh)')));
</script>
</body>
</html>
