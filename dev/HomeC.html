<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RusnetVPN · Home C</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../vesper.css">
<style>
:root{--red:#E11D2E;--red-d:#9B1220;--grad:linear-gradient(135deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);--ink:#17121A;--sub:#6B5E63;--glass:rgba(255,255,255,.62)}
@property --x{syntax:'<percentage>';inherits:true;initial-value:16.667%}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#EDE7E8;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.ph{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(60,10,15,.45),0 0 0 1px rgba(23,18,26,.06);display:block;background:#fff}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #B3121F;outline-offset:3px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.top{position:absolute;left:24px;right:24px;top:22px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.brand{font-size:20px;font-weight:800;letter-spacing:-.02em}.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.flag{width:34px;height:24px;border-radius:5px;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.3}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:none}}
/* shared nav: dark bar, notch follows the active tab */
.nv{position:absolute;left:16px;right:16px;bottom:16px;height:70px;display:flex;z-index:5;--x:16.667%;transition:--x .45s cubic-bezier(.3,.8,.3,1)}
.nv-bar{position:absolute;inset:0;border-radius:24px;background:#1C171D;-webkit-mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px);mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px)}
.nv-bub{position:absolute;left:var(--x);top:-22px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:var(--grad);box-shadow:0 12px 22px -8px rgba(200,16,46,.7)}
.nv button{position:relative;flex:1;border:0;background:none;color:#A39BA0;display:flex;flex-direction:column;align-items:center;padding-top:22px;gap:5px;font:500 11px 'Plus Jakarta Sans',sans-serif}
.nv button svg{width:24px;height:24px;transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.nv button.on{color:#fff;font-weight:700}.nv button.on svg{transform:translateY(-27px)}
.nv button:focus-visible{outline:2px solid #fff;outline-offset:-6px}
.nv.still,.nv.still *{transition:none!important}
.tabmsg{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:15px;color:var(--sub);display:none;z-index:4}
.ph.away .tabmsg{display:block}.ph.away .scene{opacity:.08;pointer-events:none}
.scene{transition:opacity .25s}

@media (max-width:430px){body{background:#fff;align-items:stretch}.ph{width:100vw!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important}}
/* ---------- C: glossy orb ---------- */
.c{background:radial-gradient(90% 50% at 50% 38%,rgba(255,138,128,.28),transparent 70%),linear-gradient(180deg,#FFFFFF 0%,#FFF6F4 55%,#FFE0DB 100%)}
.c .av{background:#fff;box-shadow:0 8px 18px -10px rgba(122,13,23,.4)}
.c .hd{position:absolute;left:0;right:0;top:90px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.c .hd small{font-size:14px;color:var(--sub);font-weight:500}
.c .hd b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.c .orbw{position:absolute;left:50%;top:190px;width:230px;height:230px;margin-left:-115px}
.c .halo{position:absolute;inset:-34px;border-radius:50%;background:conic-gradient(from 200deg,rgba(225,29,46,0),rgba(225,29,46,.55),rgba(255,138,128,.1),rgba(225,29,46,0));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));opacity:.25;transition:opacity .3s}
.c[data-s=connecting] .halo{opacity:1;animation:spin 1.1s linear infinite}
.c[data-s=on] .halo{opacity:1;animation:spin 8s linear infinite}
.c .halo2{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(225,29,46,.18)}
.c .orb{position:absolute;inset:0;border-radius:50%;border:0;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:700 15px 'Plus Jakarta Sans',sans-serif;background:radial-gradient(circle at 34% 26%,#FFFFFF 0%,#FFF7F6 40%,#F4E3E4 80%,#E6CFD1 100%);box-shadow:inset 0 -18px 40px rgba(122,13,23,.12),inset 0 10px 24px rgba(255,255,255,.9),0 34px 50px -30px rgba(122,13,23,.55);transition:transform .12s}
.c .orb:active{transform:scale(.96)}
.c[data-s=on] .orb{color:#fff;background:radial-gradient(circle at 34% 26%,#FFB1A8 0%,#FF5A4E 22%,#E11D2E 52%,#9B1220 82%,#6E0A14 100%);box-shadow:inset 0 -18px 40px rgba(60,5,10,.45),inset 0 10px 24px rgba(255,255,255,.35),0 40px 60px -28px rgba(155,18,32,.85);animation:pop .5s ease}
.c .orb:before{content:"";position:absolute;left:22%;top:9%;width:48%;height:26%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0));filter:blur(1px)}
.c .orb svg{width:52px;height:52px;stroke-width:2.2;position:relative}
.c .orb span{position:relative}
.c .shadow{position:absolute;left:50%;top:452px;width:200px;height:26px;margin-left:-100px;border-radius:50%;background:radial-gradient(closest-side,rgba(122,13,23,.32),transparent);filter:blur(3px)}
.c .time{position:absolute;left:0;right:0;top:494px;text-align:center;font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.c .chips{position:absolute;left:20px;right:20px;top:552px;display:flex;justify-content:center;gap:8px}
.c .chip{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid #fff;box-shadow:0 10px 20px -16px rgba(122,13,23,.5);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.c .chip svg{width:15px;height:15px;color:var(--red)}
.c .loc{position:absolute;left:20px;right:20px;top:616px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:24px;background:rgba(255,255,255,.8);border:1px solid #fff;box-shadow:0 18px 34px -24px rgba(122,13,23,.55);text-align:left}
.c .loc .nm{flex:1;display:flex;flex-direction:column;line-height:1.3}.c .loc .nm b{font-size:16px}.c .loc .nm small{font-size:13px;color:var(--sub)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

img.brand{display:block;height:26px;width:auto}
</style>
</head>
<body>
<div class="ph c" data-s="off"><div class="scene">
<div class="top"><img class="brand" src="../img/rusnet-logo-light.png" alt="RusnetVPN"><span class="av">D</span></div>
<div class="hd" role="status"><small data-off="Your connection is not private" data-connecting="Securing your connection" data-on="Your connection is private"></small><b data-off="Not connected" data-connecting="Connecting…" data-on="Connected"></b></div>
<div class="orbw"><span class="halo"></span><span class="halo2"></span><button class="orb js-go"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg><span data-off="Connect" data-connecting="Cancel" data-on="Disconnect"></span></button></div>
<div class="shadow"></div>
<div class="time js-time">00:00:00</div>
<div class="chips"><span class="chip"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span data-off="— Mb/s" data-connecting="— Mb/s" data-on="84.2 Mb/s"></span></span><span class="chip"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span data-off="— Mb/s" data-connecting="— Mb/s" data-on="21.6 Mb/s"></span></span><span class="chip"><svg class="i" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span data-off="— ms" data-connecting="— ms" data-on="32 ms"></span></span></div>
<button class="loc"><span class="flag f-au"></span><span class="nm"><b>Australia</b><small>Melbourne · Fastest</small></span><svg class="i" viewBox="0 0 24 24" style="color:#B9AEB2"><path d="M9 18l6-6-6-6"/></svg></button>
</div>
<p class="tabmsg"></p>
<nav class="nv"><span class="nv-bar"></span><span class="nv-bub"></span><button class="on" data-tab="0"><svg class="i" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>Home</button><button data-tab="1"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>Server List</button><button data-tab="2"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Menu</button></nav>
</div>
<script>
const PAGES=['HomeC.html','ServersC.html','MenuC.html'],HERE=0;
/* nav: notch slides to the tapped tab, then the page changes */
let go;(()=>{const nav=document.querySelector('.nv'),bs=nav.querySelectorAll('button'),x=k=>((k+.5)/3*100).toFixed(3)+'%';
const mark=k=>{nav.style.setProperty('--x',x(k));bs.forEach((b,i)=>{b.classList.toggle('on',i===k);b.toggleAttribute('aria-current',i===k)})};
go=k=>{if(k===HERE)return;mark(k);setTimeout(()=>location.href=PAGES[k]+'?from='+HERE,380)};
const from=+new URLSearchParams(location.search).get('from');
if(location.search.includes('from=')&&from!==HERE){nav.classList.add('still');mark(from);requestAnimationFrame(()=>requestAnimationFrame(()=>{nav.classList.remove('still');mark(HERE)}))}else mark(HERE);
bs.forEach((b,k)=>b.addEventListener('click',()=>go(k)))})();
const fmt=ms=>{const s=Math.floor(ms/1000);return [s/3600|0,(s/60|0)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':')};
document.querySelectorAll('.ph').forEach(ph=>{
  let t0=0,wait=null,tick=null;
  const set=s=>{
    ph.dataset.s=s;
    ph.querySelectorAll('[data-'+s+']').forEach(e=>e.textContent=e.getAttribute('data-'+s));
    ph.querySelectorAll('[data-html-'+s+']').forEach(e=>e.innerHTML=e.getAttribute('data-html-'+s));
    ph.querySelectorAll('.js-go').forEach(b=>b.setAttribute('aria-label',{off:'Connect',connecting:'Cancel connecting',on:'Disconnect'}[s]));
    clearInterval(tick);
    const times=ph.querySelectorAll('.js-time');
    if(s==='on'){t0=Date.now();tick=setInterval(()=>times.forEach(e=>e.textContent=fmt(Date.now()-t0)),1000)}
    else times.forEach(e=>e.textContent='00:00:00');
  };
  ph.querySelectorAll('.js-go').forEach(b=>b.addEventListener('click',()=>{
    const s=ph.dataset.s;clearTimeout(wait);
    if(s==='off'){set('connecting');wait=setTimeout(()=>set('on'),1800)}
    else set('off');
  }));
  const sel=(()=>{try{return JSON.parse(localStorage.getItem('rusnet:loc'))}catch(e){return null}})();
  if(sel){const N={au:'Australia',at:'Austria',be:'Belgium',bg:'Bulgaria',ca:'Canada',cl:'Chile',cz:'Czechia',dk:'Denmark',de:'Germany',jp:'Japan',sg:'Singapore',ch:'Switzerland',gb:'United Kingdom',us:'United States'},l=ph.querySelector('.loc');
    l.querySelector('.flag').className='flag f-'+sel.c;l.querySelector('b').textContent=N[sel.c]||sel.c;l.querySelector('small').textContent=sel.t+(sel.smart?' · Fastest':'')}
  ph.querySelector('.loc').addEventListener('click',()=>go(1));
  set('off');
});
</script>
</body>
</html>
