<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RusnetVPN · Server List C</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../vesper.css">
<style>
:root{--red:#E11D2E;--red-d:#9B1220;--grad:linear-gradient(135deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);--ink:#17121A;--sub:#6B5E63;--faint:#B9AEB2}
@property --x{syntax:'<percentage>';inherits:true;initial-value:50%}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#EDE7E8;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.ph{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(60,10,15,.45),0 0 0 1px rgba(23,18,26,.06);background:#fff}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #B3121F;outline-offset:3px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.flag{width:36px;height:26px;border-radius:6px;flex:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* shared nav */
.nv{position:absolute;left:16px;right:16px;bottom:16px;height:70px;display:flex;z-index:5;--x:50%;transition:--x .45s cubic-bezier(.3,.8,.3,1)}
.nv-bar{position:absolute;inset:0;border-radius:24px;background:#1C171D;-webkit-mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px);mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px)}
.nv-bub{position:absolute;left:var(--x);top:-22px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:var(--grad);box-shadow:0 12px 22px -8px rgba(200,16,46,.7)}
.nv button{position:relative;flex:1;border:0;background:none;color:#A39BA0;display:flex;flex-direction:column;align-items:center;padding-top:22px;gap:5px;font:500 11px 'Plus Jakarta Sans',sans-serif}
.nv button svg{width:24px;height:24px;transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.nv button.on{color:#fff;font-weight:700}.nv button.on svg{transform:translateY(-27px)}
.nv button:focus-visible{outline:2px solid #fff;outline-offset:-6px}
.nv.still,.nv.still *{transition:none!important}
.ph:after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;z-index:4;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 70%)}
@media (max-width:430px){body{background:#fff;align-items:stretch}.ph{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}

/* ---------- Server List ---------- */
.scroll{position:absolute;inset:0;overflow-y:auto;padding:22px 20px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
.hd h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.rf{width:40px;height:40px;border-radius:50%;border:1px solid #EFE3E5;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -10px rgba(122,13,23,.4)}
.rf svg{width:20px;height:20px;transition:transform .7s cubic-bezier(.3,.8,.3,1)}
.rf.go svg{transform:rotate(360deg)}
.hd small{display:block;font-size:13px;color:var(--sub);margin-top:4px;font-weight:500}
.cur{display:flex;align-items:center;gap:6px;padding:7px 10px 7px 8px;border-radius:999px;background:#fff;box-shadow:0 8px 18px -12px rgba(122,13,23,.5);font-size:12px;font-weight:700}
.cur .flag{width:22px;height:16px;border-radius:4px}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:18px;background:#fff;border:1px solid #EFE3E5;box-shadow:0 10px 22px -20px rgba(122,13,23,.6);color:#8A7F84}
.search input{flex:1;border:0;background:none;font:500 15px 'Plus Jakarta Sans',sans-serif;color:var(--ink);outline:none;min-width:0}
.search input::placeholder{color:var(--faint)}
.seg{position:relative;display:flex;margin:14px 0 4px;padding:4px;border-radius:16px;background:#F8EEF0;border:1px solid #F1E2E5}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:linear-gradient(135deg,#E11D2E,#F0505B);box-shadow:0 8px 16px -10px rgba(179,18,31,.9);transition:transform .35s cubic-bezier(.3,.8,.3,1)}
.seg[data-v=fav] .pill{transform:translateX(100%)}
.seg button{position:relative;flex:1;height:38px;border:0;background:none;font-size:14px;font-weight:600;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{color:#fff}
.seg button.on .n{background:rgba(255,255,255,.25);color:#fff}
.seg button svg{width:16px;height:16px}
.seg .n{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:rgba(155,18,32,.12);color:var(--red-d);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
/* smart pick: glossy red card */
.smart{margin-top:14px;position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;border-radius:24px;text-align:left;color:#fff;overflow:hidden;background:radial-gradient(circle at 18% 0%,#FF8A80 0%,transparent 55%),linear-gradient(135deg,#B3121F,#E11D2E 60%,#FF5A4E);box-shadow:0 22px 36px -22px rgba(155,18,32,.9),inset 0 1px 0 rgba(255,255,255,.35)}
.smart:before{content:"";position:absolute;right:-40px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.smart .bolt{position:relative;width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.smart .tx{position:relative;flex:1;display:flex;flex-direction:column;gap:3px}
.smart .tx small{font-size:12px;font-weight:600;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.smart .tx b{font-size:17px}
.smart .tx span{font-size:13px;opacity:.9}
.smart .ok{position:relative;width:36px;height:36px;border-radius:50%;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.smart.sel .ok{background:#1C171D;color:#fff}
.lbl{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 14px;font-size:15px;font-weight:700;color:var(--ink)}
.lbl span{font-weight:500;font-size:13px;color:var(--sub)}
/* country list */
.list{display:flex;flex-direction:column;gap:10px}
.ct{border-radius:26px;background:#fff;border:1px solid #EFE3E5;box-shadow:0 10px 22px -22px rgba(122,13,23,.6);animation:rise .4s both;overflow:hidden;transition:box-shadow .25s}
.ct.open{box-shadow:0 22px 36px -24px rgba(122,13,23,.7)}
.ct-h{display:flex;align-items:center;gap:8px;padding:0 14px 0 14px;height:68px}
.ct-h .flag{width:42px;height:29px;border-radius:6px}
.ct-h .main{flex:1;display:flex;align-items:center;gap:12px;height:100%;border:0;background:none;text-align:left;padding:0;min-width:0}
.ct-h .nm{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.ct-h .nm b{font-size:15px;font-weight:700}
.ct-h .nm small{font-size:12px;color:var(--sub)}
.ping{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.sig{display:flex;align-items:flex-end;gap:2px;height:12px}
.sig i{width:3px;border-radius:2px;background:#E8DADC}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:12px}
.sig.s3 i,.sig.s2 i:nth-child(-n+2),.sig.s1 i:nth-child(1){background:#16A34A}
.sig.s2 i:nth-child(-n+2){background:#E5A100}.sig.s1 i:nth-child(1){background:var(--red)}
.ib{width:36px;height:36px;border:0;border-radius:50%;background:#F7F2F3;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.ib svg{width:20px;height:20px;transition:transform .3s}
.fav.on{color:var(--red)}.fav.on svg{fill:var(--red)}
.fav.pop svg{animation:pop .4s ease}
.ct.open .chev svg{transform:rotate(180deg)}
.pro{padding:5px 11px;border-radius:9px;background:#FDEBEC;color:#D31929;font-size:12px;font-weight:800;letter-spacing:.02em}
.lk{background:#FDEBEC;color:#D31929}
.ct.locked .main{cursor:pointer}
.cities{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.3,.8,.3,1)}
.ct.open .cities{grid-template-rows:1fr}
.cities>div{overflow:hidden}
.city{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:0 8px 6px;height:50px;padding:0 12px 0 16px;border:0;border-radius:16px;background:#FFF5F4;text-align:left;font-size:14px;font-weight:600}
.city:first-child{margin-top:2px}
.city .cn{flex:1}
.city .rd{width:20px;height:20px;border-radius:50%;border:2px solid #E3D3D6;flex:none;transition:.2s}
.city.sel{background:linear-gradient(135deg,#FFE6E3,#FFD6D1);color:var(--red-d)}
.city.sel .rd{border:6px solid var(--red);box-shadow:0 0 0 4px rgba(225,29,46,.14)}
.empty{display:none;flex-direction:column;align-items:center;gap:10px;padding:40px 20px;text-align:center;color:var(--sub);font-size:14px}
.empty b{color:var(--ink);font-size:16px}
.empty .ic{width:60px;height:60px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--red);box-shadow:0 12px 24px -16px rgba(122,13,23,.6)}
.toast{position:absolute;left:50%;bottom:104px;z-index:6;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:#1C171D;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.3,.8,.3,1)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast svg{width:16px;height:16px;color:#FF8A80}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ph">
<div class="scroll">
  <div class="hd"><h1>Select Server</h1><button class="rf" id="rf" aria-label="Refresh servers"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg></button></div>
  <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search countries, cities, or IP…" aria-label="Search servers"></label>
  <button class="smart" id="smart"><span class="bolt"><svg class="i" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span><span class="tx"><small>Smart location</small><b>Fastest server</b><span id="smartTx"></span></span><span class="ok"><svg class="i" viewBox="0 0 24 24" id="smartIc"></svg></span></button>
  <div class="seg" data-v="all" role="tablist"><span class="pill"></span><button class="on" data-v="all" role="tab" aria-selected="true">All Servers</button><button data-v="fav" role="tab" aria-selected="false">Favorites <span class="n" id="favn">0</span></button></div>
  <p class="lbl" id="lbl">All locations <span id="lblN"></span></p>
  <div class="list" id="list"></div>
  <div class="empty" id="empty"><span class="ic"><svg class="i" viewBox="0 0 24 24" id="emptyIc"></svg></span><b id="emptyT"></b><span id="emptyS"></span></div>
</div>
<div class="toast" id="toast" role="status"><svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span></span></div>
<nav class="nv" aria-label="Main"><span class="nv-bar"></span><span class="nv-bub"></span><button data-tab="0"><svg class="i" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>Home</button><button data-tab="1"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>Server List</button><button data-tab="2"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Menu</button></nav>
</div>
<script>
const PAGES=['HomeC.html','ServersC.html','MenuC.html'],HERE=1;
/* nav: notch slides to the tapped tab, then the page changes */
(()=>{const nav=document.querySelector('.nv'),bs=nav.querySelectorAll('button'),x=k=>((k+.5)/3*100).toFixed(3)+'%';
const mark=k=>{nav.style.setProperty('--x',x(k));bs.forEach((b,i)=>{b.classList.toggle('on',i===k);b.toggleAttribute('aria-current',i===k)})};
const from=+new URLSearchParams(location.search).get('from');
if(location.search.includes('from=')&&from!==HERE){nav.classList.add('still');mark(from);requestAnimationFrame(()=>requestAnimationFrame(()=>{nav.classList.remove('still');mark(HERE)}))}else mark(HERE);
bs.forEach((b,k)=>b.addEventListener('click',()=>{if(k===HERE)return;mark(k);setTimeout(()=>location.href=PAGES[k]+'?from='+HERE,380)}))})();

const C=[['au','Australia',['Melbourne','Sydney','Perth']],['at','Austria',['Vienna','Salzburg']],['be','Belgium',['Brussels','Antwerp']],['bg','Bulgaria',['Sofia']],['ca','Canada',['Toronto','Vancouver','Montreal']],['cl','Chile',['Santiago']],['cz','Czechia',['Prague','Brno']],['dk','Denmark',['Copenhagen']],['de','Germany',['Frankfurt','Berlin','Munich']],['jp','Japan',['Tokyo','Osaka']],['sg','Singapore',['Singapore']],['ch','Switzerland',['Zurich','Geneva']],['gb','United Kingdom',['London','Manchester']],['us','United States',['New York','Los Angeles','Miami','Chicago']]];
const FREE=new Set(['au','jp','sg']),free=c=>FREE.has(c[0]);
C.sort((a,b)=>free(b)-free(a));   // free countries first, then PRO
let J={};                          // small ping changes after a refresh
const ms=(c,city)=>{let h=7;for(const ch of c+city)h=(h*131+ch.charCodeAt(0))%9973;return Math.max(12,18+h%140+(J[c+city]||0))};
const sig=m=>`<span class="sig s${m<60?3:m<110?2:1}" aria-hidden="true"><i></i><i></i><i></i></span>`;
const best=c=>Math.min(...c[2].map(t=>ms(c[0],t)));
const fastestOf=()=>C.filter(free).flatMap(c=>c[2].map(t=>({c:c[0],cn:c[1],t,m:ms(c[0],t)}))).sort((a,b)=>a.m-b.m)[0];
let fastest=fastestOf();
const IC={heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',down:'<path d="m6 9 6 6 6-6"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',check:'<path d="M5 12l5 5 9-10"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'};
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let sel=ls('rusnet:loc',{c:fastest.c,t:fastest.t,smart:true}),favs=new Set(ls('rusnet:favs',[])),open=sel.smart?null:sel.c,view='all',q='',popped=null;
const $=id=>document.getElementById(id);

function render(){
  $('favn').textContent=favs.size;$('favn').hidden=!favs.size;
  $('smart').classList.toggle('sel',!!sel.smart);
  $('smart').setAttribute('aria-pressed',!!sel.smart);
  $('smartTx').textContent=`${fastest.t}, ${fastest.cn} · ${fastest.m} ms`;
  $('smartIc').innerHTML=sel.smart?IC.check:IC.arrow;
  $('smart').style.display=view==='all'&&!q?'':'none';
  const k=q.toLowerCase(),rows=C.filter(c=>(view==='all'||favs.has(c[0]))&&(!k||c[1].toLowerCase().includes(k)||c[2].some(t=>t.toLowerCase().includes(k))));
  $('lbl').firstChild.textContent=q?'Results ':view==='fav'?'Your favorites ':'All locations ';
  $('lblN').textContent=rows.length+(rows.length===1?' country':' countries');
  $('list').innerHTML=rows.map((c,i)=>{const o=open===c[0]||(k&&c[2].some(t=>t.toLowerCase().includes(k))&&!c[1].toLowerCase().includes(k)),f=favs.has(c[0]),m=best(c);
    if(!free(c))return `<div class="ct locked" style="animation-delay:${Math.min(i,8)*30}ms"><div class="ct-h"><button class="main js-lock" data-c="${c[0]}" aria-label="${c[1]}, Premium only"><span class="flag f-${c[0]}"></span><span class="nm"><b>${c[1]}</b><small>${c[2].length} location${c[2].length>1?'s':''}</small></span><span class="pro">PRO</span></button><button class="ib lk js-lock" data-c="${c[0]}" aria-label="Unlock ${c[1]} with Premium"><svg class="i" viewBox="0 0 24 24">${IC.lock}</svg></button></div></div>`;
    return `<div class="ct ${o?'open':''}" style="animation-delay:${Math.min(i,8)*30}ms">
<div class="ct-h"><button class="main js-exp" data-c="${c[0]}" aria-expanded="${o}"><span class="flag f-${c[0]}"></span><span class="nm"><b>${c[1]}</b><small>${c[2].length} location${c[2].length>1?'s':''}</small></span><span class="ping">${sig(m)}${m} ms</span></button>
<button class="ib fav js-fav ${f?'on':''} ${popped===c[0]?'pop':''}" data-c="${c[0]}" aria-pressed="${f}" aria-label="${f?'Remove from':'Add to'} favorites"><svg class="i" viewBox="0 0 24 24">${IC.heart}</svg></button>
<button class="ib chev js-exp" data-c="${c[0]}" aria-label="Show ${c[1]} cities" aria-expanded="${o}"><svg class="i" viewBox="0 0 24 24">${IC.down}</svg></button></div>
<div class="cities"><div>${c[2].map(t=>{const s=!sel.smart&&sel.c===c[0]&&sel.t===t,m=ms(c[0],t);return `<button class="city js-city ${s?'sel':''}" data-c="${c[0]}" data-t="${t}" aria-pressed="${s}"><span class="cn">${t}</span><span class="ping">${sig(m)}${m} ms</span><span class="rd"></span></button>`}).join('')}</div></div></div>`}).join('');
  const none=!rows.length;$('empty').style.display=none?'flex':'none';
  if(none){$('emptyIc').innerHTML=q?IC.search:IC.heart;$('emptyT').textContent=q?'No servers found':'No favorites yet';$('emptyS').textContent=q?`Nothing matches “${q}”. Try another country or city.`:'Tap the heart on any country to keep it here.'}
  popped=null;
}
let tt;const toast=t=>{const e=$('toast');e.querySelector('span').textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1600)};
$('list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const c=b.dataset.c;
  if(b.classList.contains('js-exp')){open=open===c?null:c;render()}
  else if(b.classList.contains('js-fav')){favs.has(c)?favs.delete(c):(favs.add(c),popped=c);save('rusnet:favs',[...favs]);render()}
  else if(b.classList.contains('js-lock')){toast(`${C.find(x=>x[0]===c)[1]} is a Premium server`)}
  else if(b.classList.contains('js-city')){sel={c,t:b.dataset.t};save('rusnet:loc',sel);render();toast(`${b.dataset.t} selected`)}});
$('smart').addEventListener('click',()=>{sel={c:fastest.c,t:fastest.t,smart:true};save('rusnet:loc',sel);open=null;render();toast('Fastest server selected')});
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.v;document.querySelector('.seg').dataset.v=view;document.querySelectorAll('.seg button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b)});render()}));
$('q').addEventListener('input',e=>{q=e.target.value.trim();render()});
$('rf').addEventListener('click',()=>{const b=$('rf');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');
  J={};C.forEach(c=>c[2].forEach(t=>J[c[0]+t]=Math.round(Math.random()*16-8)));fastest=fastestOf();
  if(sel.smart){sel={c:fastest.c,t:fastest.t,smart:true};save('rusnet:loc',sel)}
  setTimeout(()=>{render();toast('Server list refreshed')},450)});
render();
</script>
</body>
</html>
