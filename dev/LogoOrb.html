<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RusnetVPN Logo Orb</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#FFFFFF 0%,#FFF6F4 55%,#FFE0DB 100%);cursor:pointer}

/* ===== RusnetVPN logo orb — copy from here ===== */
.rn-orb{position:relative;width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 26%,#FFB1A8 0%,#FF5A4E 22%,#E11D2E 52%,#9B1220 82%,#6E0A14 100%);
  box-shadow:inset 0 -16px 34px rgba(60,5,10,.45),inset 0 10px 22px rgba(255,255,255,.35),0 40px 60px -26px rgba(155,18,32,.85);
  animation:rnIn .9s cubic-bezier(.2,.9,.3,1.3) both}
.rn-orb:before{content:"";position:absolute;left:22%;top:9%;width:48%;height:24%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0))}
.rn-orb img{position:relative;width:48%;height:auto;filter:drop-shadow(0 6px 10px rgba(60,5,10,.35));animation:rnMark .6s cubic-bezier(.2,.9,.3,1.4) .45s both}
.rn-halo{position:absolute;inset:-12%;border-radius:50%;background:conic-gradient(from 0deg,rgba(225,29,46,0),rgba(225,29,46,.6),rgba(255,138,128,.1),rgba(225,29,46,0));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  animation:rnFade .5s ease 1.1s both,rnSpin 1.6s linear 1.1s infinite}
.rn-rip{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(225,29,46,.35);opacity:0;animation:rnRip 2.4s cubic-bezier(.2,.7,.3,1) .9s infinite}
.rn-rip.r2{animation-delay:1.7s}
.rn-shadow{position:absolute;left:10%;right:10%;bottom:-46px;height:20px;border-radius:50%;background:radial-gradient(closest-side,rgba(122,13,23,.3),transparent);animation:rnFade .8s ease .4s both}
@keyframes rnIn{from{opacity:0;transform:scale(.3)}}
@keyframes rnMark{from{opacity:0;transform:scale(.4) rotate(-12deg)}}
@keyframes rnFade{from{opacity:0}}
@keyframes rnSpin{to{transform:rotate(360deg)}}
@keyframes rnRip{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(2.6)}}
@media (prefers-reduced-motion:reduce){.rn-orb,.rn-orb *{animation:none!important}.rn-rip{display:none}}
/* ===== end ===== */
</style>
</head>
