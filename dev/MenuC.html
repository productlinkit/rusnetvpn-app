<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RusnetVPN · Menu C</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E11D2E;--red-d:#9B1220;--grad:linear-gradient(135deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);--ink:#17121A;--sub:#6B5E63;--faint:#B9AEB2}
@property --x{syntax:'<percentage>';inherits:true;initial-value:83.333%}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#EDE7E8;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.ph{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(60,10,15,.45),0 0 0 1px rgba(23,18,26,.06);background:radial-gradient(90% 40% at 20% 0%,rgba(255,138,128,.22),transparent 70%),linear-gradient(180deg,#FFFFFF 0%,#FFF6F4 55%,#FFE0DB 100%)}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid #B3121F;outline-offset:3px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* shared nav */
.nv{position:absolute;left:16px;right:16px;bottom:16px;height:70px;display:flex;z-index:5;--x:83.333%;transition:--x .45s cubic-bezier(.3,.8,.3,1)}
.nv-bar{position:absolute;inset:0;border-radius:24px;background:#1C171D;-webkit-mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px);mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px)}
.nv-bub{position:absolute;left:var(--x);top:-22px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:var(--grad);box-shadow:0 12px 22px -8px rgba(200,16,46,.7)}
.nv button{position:relative;flex:1;border:0;background:none;color:#A39BA0;display:flex;flex-direction:column;align-items:center;padding-top:22px;gap:5px;font:500 11px 'Plus Jakarta Sans',sans-serif}
.nv button svg{width:24px;height:24px;transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.nv button.on{color:#fff;font-weight:700}.nv button.on svg{transform:translateY(-27px)}
.nv button:focus-visible{outline:2px solid #fff;outline-offset:-6px}
.nv.still,.nv.still *{transition:none!important}
.ph:after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;z-index:4;pointer-events:none;background:linear-gradient(180deg,rgba(255,224,219,0),#FFE0DB 70%)}
@media (max-width:430px){body{background:#fff;align-items:stretch}.ph{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}

/* ---------- Menu ---------- */
.scroll{position:absolute;inset:0;overflow-y:auto;padding:22px 20px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{animation:rise .45s both}
.scroll>*:nth-child(2){animation-delay:.05s}.scroll>*:nth-child(3){animation-delay:.1s}.scroll>*:nth-child(n+4){animation-delay:.15s}
h1{margin:0 0 16px;font-size:28px;font-weight:700;letter-spacing:-.02em}
/* profile: glossy red card */
.pro{position:relative;padding:18px;border-radius:28px;color:#fff;overflow:hidden;background:radial-gradient(circle at 15% 0%,#FF8A80 0%,transparent 55%),linear-gradient(140deg,#9B1220,#E11D2E 60%,#FF5A4E);box-shadow:0 26px 40px -26px rgba(155,18,32,.95),inset 0 1px 0 rgba(255,255,255,.35)}
.pro:before{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 65%)}
.pro:after{content:"";position:absolute;right:-30px;bottom:-90px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.who{position:relative;display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:0;text-align:left;color:#fff}
.av{width:54px;height:54px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--red);background:radial-gradient(circle at 34% 26%,#fff,#FFE9E7 70%,#F6CFCB);box-shadow:0 10px 20px -10px rgba(60,5,10,.7)}
.who .nm{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.who .nm b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.2);font-size:11px;font-weight:700;letter-spacing:.04em}
.badge svg{width:13px;height:13px;color:#FFD66B}
.who>svg{opacity:.75}
.exp{position:relative;display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2);font-size:13px}
.exp span{opacity:.85}.exp b{display:block;font-size:15px;margin-top:2px;opacity:1}
.exp button{border:0;border-radius:99px;padding:10px 16px;background:#fff;color:var(--red-d);font-size:13px;font-weight:700}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.st{padding:12px;border-radius:20px;background:rgba(255,255,255,.82);border:1px solid #fff;box-shadow:0 14px 26px -22px rgba(122,13,23,.55);display:flex;flex-direction:column;gap:6px}
.st svg{width:18px;height:18px;color:var(--red)}
.st b{font-size:16px;font-variant-numeric:tabular-nums}
.st small{font-size:11px;color:var(--sub);font-weight:500}
.lbl{margin:22px 4px 10px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.02em}
.card{border-radius:22px;background:rgba(255,255,255,.82);border:1px solid #fff;box-shadow:0 14px 26px -22px rgba(122,13,23,.55);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border:0;background:none;text-align:left}
.row+.row{border-top:1px solid #F4E9EA}
.row:active{background:#FFF5F4}
.tl{width:40px;height:40px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--red);background:linear-gradient(145deg,#FFF1EF,#FFDCD7);box-shadow:inset 0 1px 0 #fff}
.tl svg{width:20px;height:20px}
.tl.dk{color:#fff;background:linear-gradient(145deg,#3A3036,#1C171D);box-shadow:none}
.row .tx{flex:1;display:flex;flex-direction:column;gap:2px;line-height:1.3;min-width:0}
.row .tx b{font-size:15px;font-weight:600}
.row .tx small{font-size:12px;color:var(--sub)}
.row>svg{width:18px;height:18px;color:var(--faint)}
.row.out .tx b{color:var(--red)}
/* switch */
.sw{position:relative;width:50px;height:30px;border-radius:99px;background:#E8DCDE;flex:none;transition:background .25s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(60,10,15,.25);transition:transform .3s cubic-bezier(.3,.8,.3,1.3)}
.row[aria-checked=true] .sw{background:var(--grad)}
.row[aria-checked=true] .sw:after{transform:translateX(20px)}
.ver{margin:22px 0 0;text-align:center;font-size:12px;color:var(--faint)}
/* bottom sheet */
.dim{position:absolute;inset:0;z-index:8;background:rgba(23,18,26,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;padding:12px 20px 28px;border-radius:30px 30px 0 0;background:#fff;transform:translateY(105%);transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.sheet:before{content:"";display:block;width:40px;height:5px;margin:0 auto 18px;border-radius:9px;background:#E8DCDE}
.ph.sheeted .dim{opacity:1;pointer-events:auto}.ph.sheeted .sheet{transform:none}
.sheet h2{margin:0 0 6px;font-size:20px;font-weight:700}
.sheet p{margin:0 0 18px;font-size:14px;color:var(--sub);line-height:1.5}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:10px;border-radius:18px;border:1.5px solid #F0E3E5;background:#fff;text-align:left}
.opt .tx{flex:1;display:flex;flex-direction:column;gap:2px}.opt .tx b{font-size:15px}.opt .tx small{font-size:12px;color:var(--sub)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #E3D3D6;flex:none;transition:.2s}
.opt.sel{border-color:var(--red);background:#FFF5F4}.opt.sel .rd{border:7px solid var(--red)}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;height:52px;border-radius:16px;border:0;font-size:15px;font-weight:700}
.btn.p{background:var(--grad);color:#fff;box-shadow:0 14px 24px -14px rgba(155,18,32,.9)}
.btn.g{background:#F6EEEF}
.btn.p .spin{width:20px;height:20px;margin:0 auto;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
.toast{position:absolute;left:50%;bottom:104px;z-index:6;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:#1C171D;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.3,.8,.3,1)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast svg{width:16px;height:16px;color:#FF8A80}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ph" id="ph">
<div class="scroll">
  <h1>Menu</h1>
  <div class="pro">
    <button class="who js-open" data-t="Account"><span class="av">D</span><span class="nm"><b>dina@rusnet.com</b><span class="badge"><svg class="i" viewBox="0 0 24 24"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg>PREMIUM · 12 MONTHS</span></span><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <div class="exp"><span>Renews on<b>12 March 2027</b></span><button class="js-open" data-t="Manage plan">Manage plan</button></div>
  </div>
  <div class="stats">
    <div class="st"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><b>18.4 GB</b><small>Data this month</small></div>
    <div class="st"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6z"/></svg><b>42 h</b><small>Time protected</small></div>
    <div class="st"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg><b>2 / 5</b><small>Devices</small></div>
  </div>

  <p class="lbl">Quick settings</p>
  <div class="card">
    <button class="row js-sw" role="switch" aria-checked="true" data-k="kill" data-t="Kill switch"><span class="tl"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></span><span class="tx"><b>Kill switch</b><small>Block internet if VPN drops</small></span><span class="sw"></span></button>
    <button class="row js-sw" role="switch" aria-checked="false" data-k="auto" data-t="Auto-connect"><span class="tl"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/><path d="M2 9a14 14 0 0 1 20 0"/></svg></span><span class="tx"><b>Auto-connect</b><small>On public Wi-Fi networks</small></span><span class="sw"></span></button>
  </div>

  <p class="lbl">VPN settings</p>
  <div class="card">
    <button class="row" id="proto"><span class="tl"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg></span><span class="tx"><b>Protocol</b><small id="protoTx"></small></span><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="row js-open" data-t="Connection settings"><span class="tl"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span><span class="tx"><b>Connection settings</b><small>DNS, split tunneling</small></span><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="row js-open" data-t="Notifications"><span class="tl"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg></span><span class="tx"><b>Notifications</b><small>3 alerts on</small></span><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>

  <p class="lbl">Help &amp; about</p>
  <div class="card">
    <button class="row js-open" data-t="Support center"><span class="tl dk"><svg class="i" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="7" rx="2"/><rect x="17" y="13" width="4" height="7" rx="2"/></svg></span><span class="tx"><b>Support center</b><small>FAQ, live chat &amp; email</small></span><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="row js-open" data-t="About us"><span class="tl dk"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span><span class="tx"><b>About us</b><small>Version 1.2.0</small></span><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="row js-open" data-t="Terms and Privacy"><span class="tl dk"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span class="tx"><b>Terms &amp; Privacy Policy</b><small>Last update: 12 June 2026</small></span><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>

  <div class="card" style="margin-top:14px"><button class="row out" id="out"><span class="tl"><svg class="i" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg></span><span class="tx"><b>Sign out</b></span></button></div>
  <p class="ver">RusnetVPN 1.2.0</p>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"></div>
<div class="toast" id="toast" role="status"><svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span></span></div>
<nav class="nv" aria-label="Main"><span class="nv-bar"></span><span class="nv-bub"></span><button data-tab="0"><svg class="i" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>Home</button><button data-tab="1"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>Server List</button><button data-tab="2"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Menu</button></nav>
</div>
<script>
const PAGES=['HomeC.html','ServersC.html','MenuC.html'],HERE=2;
/* nav: notch slides to the tapped tab, then the page changes */
(()=>{const nav=document.querySelector('.nv'),bs=nav.querySelectorAll('button'),x=k=>((k+.5)/3*100).toFixed(3)+'%';
const mark=k=>{nav.style.setProperty('--x',x(k));bs.forEach((b,i)=>{b.classList.toggle('on',i===k);b.toggleAttribute('aria-current',i===k)})};
const from=+new URLSearchParams(location.search).get('from');
if(location.search.includes('from=')&&from!==HERE){nav.classList.add('still');mark(from);requestAnimationFrame(()=>requestAnimationFrame(()=>{nav.classList.remove('still');mark(HERE)}))}else mark(HERE);
bs.forEach((b,k)=>b.addEventListener('click',()=>{if(k===HERE)return;mark(k);setTimeout(()=>location.href=PAGES[k]+'?from='+HERE,380)}))})();

const $=id=>document.getElementById(id),ph=$('ph'),sheet=$('sheet');
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const P={wg:['WireGuard','Fastest, modern encryption'],oc:['OpenConnect','Works on strict networks']};
let opt=ls('rusnet:opts',{kill:true,auto:false,proto:'wg'}),last=null;
let tt;const toast=t=>{const e=$('toast');e.querySelector('span').textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1600)};
const paint=()=>{document.querySelectorAll('.js-sw').forEach(b=>b.setAttribute('aria-checked',!!opt[b.dataset.k]));$('protoTx').textContent=P[opt.proto][0]};
const openSheet=html=>{last=document.activeElement;sheet.innerHTML=html;ph.classList.add('sheeted');setTimeout(()=>sheet.querySelector('button')?.focus(),350)};
const closeSheet=()=>{ph.classList.remove('sheeted');last?.focus()};
$('dim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ph.classList.contains('sheeted'))closeSheet()});

document.querySelectorAll('.js-sw').forEach(b=>b.addEventListener('click',()=>{opt[b.dataset.k]=!opt[b.dataset.k];save('rusnet:opts',opt);paint();toast(`${b.dataset.t} ${opt[b.dataset.k]?'on':'off'}`)}));
document.querySelectorAll('.js-open').forEach(b=>b.addEventListener('click',()=>toast(`${b.dataset.t} (contoh)`)));

$('proto').addEventListener('click',()=>{let pick=opt.proto;
  openSheet(`<h2 id="shT">Protocol</h2><p>Choose how your device connects to RusnetVPN servers.</p>${Object.entries(P).map(([k,[n,d]])=>`<button class="opt ${k===pick?'sel':''}" data-p="${k}" aria-pressed="${k===pick}"><span class="tx"><b>${n}</b><small>${d}</small></span><span class="rd"></span></button>`).join('')}<div class="btns"><button class="btn p" id="apply">Apply</button></div>`);
  sheet.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>{pick=o.dataset.p;sheet.querySelectorAll('.opt').forEach(x=>{x.classList.toggle('sel',x===o);x.setAttribute('aria-pressed',x===o)})}));
  $('apply').addEventListener('click',()=>{opt.proto=pick;save('rusnet:opts',opt);paint();closeSheet();toast(`Protocol: ${P[pick][0]}`)})});

$('out').addEventListener('click',()=>{
  openSheet(`<h2 id="shT">Sign out?</h2><p>You will be disconnected from RusnetVPN and need to sign in again to use premium servers.</p><div class="btns"><button class="btn g" id="no">Cancel</button><button class="btn p" id="yes">Sign out</button></div>`);
  $('no').addEventListener('click',closeSheet);
  $('yes').addEventListener('click',e=>{e.currentTarget.innerHTML='<span class="spin"></span>';setTimeout(()=>{closeSheet();toast('Signed out (contoh)')},1200)})});
paint();
</script>
</body>
</html>
