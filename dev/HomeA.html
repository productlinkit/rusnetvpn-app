<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RusnetVPN · Home A</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../vesper.css">
<style>
:root{--red:#E11D2E;--red-d:#9B1220;--grad:linear-gradient(135deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);--ink:#17121A;--sub:#6B5E63;--glass:rgba(255,255,255,.62)}
@property --x{syntax:'<percentage>';inherits:true;initial-value:16.667%}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#EDE7E8;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.ph{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(60,10,15,.45),0 0 0 1px rgba(23,18,26,.06);display:block;background:#fff}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #B3121F;outline-offset:3px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.top{position:absolute;left:24px;right:24px;top:22px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.brand{font-size:20px;font-weight:800;letter-spacing:-.02em}.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.flag{width:34px;height:24px;border-radius:5px;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.3}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:none}}
/* shared nav: dark bar, notch follows the active tab */
.nv{position:absolute;left:16px;right:16px;bottom:16px;height:70px;display:flex;z-index:5;--x:16.667%;transition:--x .45s cubic-bezier(.3,.8,.3,1)}
.nv-bar{position:absolute;inset:0;border-radius:24px;background:#1C171D;-webkit-mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px);mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px)}
.nv-bub{position:absolute;left:var(--x);top:-22px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:var(--grad);box-shadow:0 12px 22px -8px rgba(200,16,46,.7)}
.nv button{position:relative;flex:1;border:0;background:none;color:#A39BA0;display:flex;flex-direction:column;align-items:center;padding-top:22px;gap:5px;font:500 11px 'Plus Jakarta Sans',sans-serif}
.nv button svg{width:24px;height:24px;transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.nv button.on{color:#fff;font-weight:700}.nv button.on svg{transform:translateY(-27px)}
.nv button:focus-visible{outline:2px solid #fff;outline-offset:-6px}
.tabmsg{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:15px;color:var(--sub);display:none;z-index:4}
.ph.away .tabmsg{display:block}.ph.away .scene{opacity:.08;pointer-events:none}
.scene{transition:opacity .25s}

@media (max-width:430px){body{background:#fff;align-items:stretch}.ph{width:100vw!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important}}
/* ---------- A: glass globe ---------- */
.a{background:radial-gradient(70% 38% at 88% 6%,rgba(255,90,78,.38),transparent 70%),radial-gradient(60% 34% at -10% 52%,rgba(225,29,46,.16),transparent 70%),linear-gradient(180deg,#FFFFFF 0%,#FFF4F2 60%,#FFE2DD 100%)}
.a .pill{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 20px -12px rgba(155,18,32,.35);font-size:13px;font-weight:600;white-space:nowrap;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.a .pill i{width:8px;height:8px;border-radius:50%;background:#A39BA0}
.a[data-s=connecting] .pill i{background:#F59E0B;animation:blink 1s infinite}
.a[data-s=on] .pill i{background:#16A34A;box-shadow:0 0 0 4px rgba(22,163,74,.15)}
.a .globe{position:absolute;left:50%;top:124px;width:330px;height:330px;margin-left:-165px}
.a .arc{opacity:0;transition:opacity .3s}.a .dest{opacity:0;transition:opacity .3s}
.a[data-s=connecting] .arc{opacity:1;stroke-dasharray:6 8;animation:dash .8s linear infinite}
.a[data-s=on] .arc,.a[data-s=on] .dest{opacity:1}
.a[data-s=connecting] .dest{opacity:.5}
.a .card{position:absolute;left:16px;right:16px;bottom:114px;padding:20px;border-radius:30px;background:var(--glass);border:1px solid rgba(255,255,255,.95);box-shadow:0 30px 50px -30px rgba(122,13,23,.45);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);display:flex;flex-direction:column;gap:16px}
.a .loc{display:flex;align-items:center;gap:12px}
.a .loc .nm{flex:1;display:flex;flex-direction:column;line-height:1.3}.a .loc .nm b{font-size:16px}.a .loc .nm small{font-size:13px;color:var(--sub)}
.a .chg{font-size:13px;font-weight:700;color:var(--red);padding:8px 12px;border-radius:999px;background:rgba(225,29,46,.08);border:0;font-family:inherit}
.a .time{display:flex;align-items:baseline;justify-content:space-between}
.a .time b{font-size:36px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.a .time small{font-size:13px;color:var(--sub)}
.a .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.a .st{padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.7)}
.a .st small{display:block;font-size:11px;color:var(--sub);font-weight:500}.a .st b{font-size:16px;font-variant-numeric:tabular-nums}.a .st b em{font-style:normal;font-size:11px;color:var(--sub);font-weight:500;margin-left:2px}
.a .go{height:58px;border:0;border-radius:20px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font:700 16px 'Plus Jakarta Sans',sans-serif;box-shadow:0 16px 26px -14px rgba(200,16,46,.8);transition:transform .12s}
.a .go:active{transform:scale(.97)}
.a[data-s=connecting] .go{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.a[data-s=on] .go{background:#1C171D;box-shadow:0 16px 26px -16px rgba(28,23,29,.8)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

img.brand{display:block;height:26px;width:auto}
</style>
</head>
<body>
<div class="ph a" data-s="off"><div class="scene">
<div class="top"><img class="brand" src="../img/rusnet-logo-light.png" alt="RusnetVPN"><span class="av" style="background:#fff;box-shadow:0 8px 18px -10px rgba(122,13,23,.4)">D</span></div>
<div class="pill" role="status"><i></i><span data-off="Not protected" data-connecting="Connecting…" data-on="Protected"></span></div>
<svg class="globe" viewBox="-165 -165 330 330" aria-hidden="true">
<defs>
<radialGradient id="gA" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#FFE9E6"/><stop offset="1" stop-color="#FFC9C2"/></radialGradient>
<linearGradient id="arcA" x1="0" x2="1"><stop offset="0" stop-color="#FF8A80"/><stop offset="1" stop-color="#B3121F"/></linearGradient>
<clipPath id="cA"><circle r="130"/></clipPath>
</defs>
<circle r="150" fill="none" stroke="rgba(225,29,46,.12)"/>
<circle r="130" fill="url(#gA)" stroke="rgba(225,29,46,.25)"/>
<g clip-path="url(#cA)" fill="none" stroke="rgba(155,18,32,.16)">
<ellipse rx="130" ry="44"/><ellipse rx="130" ry="92"/><line x1="-130" x2="130"/>
<ellipse rx="44" ry="130"/><ellipse rx="92" ry="130"/><line y1="-130" y2="130"/>
<ellipse rx="130" ry="18" cy="-86"/><ellipse rx="130" ry="18" cy="86"/>
</g>
<path class="arc" d="M-62 38 Q -10 -120 70 -28" fill="none" stroke="url(#arcA)" stroke-width="3" stroke-linecap="round"/>
<circle cx="-62" cy="38" r="7" fill="#fff" stroke="#E11D2E" stroke-width="3"/>
<g class="dest"><circle cx="70" cy="-28" r="14" fill="rgba(225,29,46,.18)"/><circle cx="70" cy="-28" r="7" fill="#E11D2E"/></g>
<g font-family="Plus Jakarta Sans" font-size="11" font-weight="600" fill="#17121A"><text x="-96" y="64">You</text><text class="dest" x="50" y="-46">Melbourne</text></g>
</svg>
<div class="card">
<div class="loc"><span class="flag f-au"></span><span class="nm"><b>Australia</b><small>Melbourne · 32 ms</small></span><button class="chg">Change</button></div>
<div class="time"><b class="js-time">00:00:00</b><small>Connected time</small></div>
<div class="stats"><div class="st"><small>Download</small><b><span data-off="—" data-connecting="—" data-on="84.2"></span><em>Mb/s</em></b></div><div class="st"><small>Upload</small><b><span data-off="—" data-connecting="—" data-on="21.6"></span><em>Mb/s</em></b></div><div class="st"><small>Data left</small><b>984<em>MB</em></b></div></div>
<button class="go js-go"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg><span data-off="Connect" data-connecting="Cancel" data-on="Disconnect"></span></button>
</div>
</div>
<p class="tabmsg"></p>
<nav class="nv"><span class="nv-bar"></span><span class="nv-bub"></span><button class="on" data-tab="0"><svg class="i" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>Home</button><button data-tab="1"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>Server List</button><button data-tab="2"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Menu</button></nav>
</div>
<script>
const fmt=ms=>{const s=Math.floor(ms/1000);return [s/3600|0,(s/60|0)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':')};
document.querySelectorAll('.ph').forEach(ph=>{
  let t0=0,wait=null,tick=null;
  const set=s=>{
    ph.dataset.s=s;
    ph.querySelectorAll('[data-'+s+']').forEach(e=>e.textContent=e.getAttribute('data-'+s));
    ph.querySelectorAll('[data-html-'+s+']').forEach(e=>e.innerHTML=e.getAttribute('data-html-'+s));
    ph.querySelectorAll('.js-go').forEach(b=>b.setAttribute('aria-label',{off:'Connect',connecting:'Cancel connecting',on:'Disconnect'}[s]));
    clearInterval(tick);
    const times=ph.querySelectorAll('.js-time');
    if(s==='on'){t0=Date.now();tick=setInterval(()=>times.forEach(e=>e.textContent=fmt(Date.now()-t0)),1000)}
    else times.forEach(e=>e.textContent='00:00:00');
  };
  ph.querySelectorAll('.js-go').forEach(b=>b.addEventListener('click',()=>{
    const s=ph.dataset.s;clearTimeout(wait);
    if(s==='off'){set('connecting');wait=setTimeout(()=>set('on'),1800)}
    else set('off');
  }));
  const nav=ph.querySelector('.nv'),msg=ph.querySelector('.tabmsg');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const k=+b.dataset.tab;
    nav.style.setProperty('--x',((k+.5)/3*100).toFixed(3)+'%');
    nav.querySelectorAll('button').forEach(x=>{x.classList.toggle('on',x===b);x.toggleAttribute('aria-current',x===b)});
    ph.classList.toggle('away',k!==0);
    msg.textContent=k?b.textContent.trim()+' (contoh, isi halaman ini tetap seperti di aplikasi)':'';
  }));
  set('off');
});
</script>
</body>
</html>
