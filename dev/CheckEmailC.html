<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RusnetVPN · Check Email C</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E11D2E;--red-t:#C70F21;--grad:linear-gradient(115deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);--ink:#17121A;--sub:#6B5E63;--line:#E8D9DB;--err:#C70F21}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#EDE7E8;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.ph{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 40px 80px -40px rgba(60,10,15,.45),0 0 0 1px rgba(23,18,26,.06)}
@media (max-width:430px){body{background:#fff;align-items:stretch}.ph{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid #B3121F;outline-offset:3px}
a{color:var(--red-t);text-decoration:none;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:40px 24px 32px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.scroll>*:nth-child(2){animation-delay:.04s}.scroll>*:nth-child(3){animation-delay:.08s}.scroll>*:nth-child(n+4){animation-delay:.12s}
.logo{display:block;height:33px;width:auto;margin-left:4px}
h1{margin:36px 0 0;font-size:29px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.lead{margin:10px 0 0;font-size:15px;color:var(--sub)}
form{margin-top:30px}
.f{margin-bottom:18px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:9px}
.in{position:relative;display:flex;align-items:center;height:52px;border:1px solid var(--line);border-radius:18px;background:#fff;transition:border-color .2s,box-shadow .2s}
.in:focus-within{border-color:var(--red);box-shadow:0 0 0 4px rgba(225,29,46,.1)}
.in input{flex:1;height:100%;min-width:0;border:0;background:none;outline:none;padding:0 16px;font-size:15px}
.in input::placeholder{color:#8A7F84}
.in .eye{width:48px;height:48px;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center}
.f.bad .in{border-color:var(--err);animation:shake .35s}
.hint{margin:9px 0 0;font-size:12.5px;color:var(--sub)}
.f.bad .hint{color:var(--err)}
.f.good .hint{color:#15803D}
.terms{margin:4px 0 18px;font-size:12.5px;line-height:1.5;color:var(--sub)}
.btn{position:relative;width:100%;height:54px;border:0;border-radius:20px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.p{background:var(--grad);color:#fff;box-shadow:0 16px 26px -16px rgba(179,18,31,.9)}
.btn.p:active{transform:scale(.98)}
.btn.o{background:#fff;border:1px solid var(--line);margin-top:12px}
.btn.o.red{color:var(--red-t)}
.btn .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
.or{display:flex;align-items:center;gap:12px;margin:22px 0 10px;font-size:13px;color:var(--sub)}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.foot{margin:24px 0 0;text-align:center;font-size:14px;color:var(--sub)}
.foot a{font-weight:700;margin-left:6px}
.toast{position:absolute;left:50%;top:24px;z-index:6;padding:11px 16px;border-radius:999px;background:#1C171D;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;transform:translate(-50%,-10px);opacity:0;pointer-events:none;transition:.3s}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.back{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font-size:15px;font-weight:500}
.back svg{width:16px;height:16px;stroke-width:2.4}
.tile{width:64px;height:64px;margin-top:40px;border-radius:22px;background:#FFF1F2;color:var(--red-t);display:flex;align-items:center;justify-content:center}
.tile svg{width:30px;height:30px;stroke-width:2}
.tile svg .flap{transform-origin:50% 20%;animation:flap 1.6s ease-in-out .6s 2}
@keyframes flap{50%{transform:scaleY(.4)}}
.box{margin-top:30px;padding:20px 16px;border-radius:22px;background:#FFF7F7}
.box small{display:block;font-size:13px;color:var(--sub)}
.box b{display:block;margin:10px 0;font-size:17px;font-weight:700;word-break:break-all}
.box p{margin:0;font-size:13px;color:var(--sub)}
.btn.p.mt{margin-top:32px}
.link{display:block;margin:22px auto 0;border:0;background:none;font-size:15px;font-weight:500;color:var(--red-t);padding:4px}
.note{margin:56px 0 0;text-align:center;font-size:13px;line-height:1.5;color:var(--sub)}
.help{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-size:13px;color:var(--sub)}
.help a{color:var(--sub)}
</style>
</head>
<body>
<div class="ph">
<div class="scroll">
  <img class="logo" src="../img/rusnet-logo-light.png" alt="RusnetVPN">
  <div><a class="back" id="back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back to sign up</a></div>
  <div class="tile" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path class="flap" d="m4 7 8 6 8-6"/></svg></div>
  <h1 style="margin-top:28px">Check your email</h1>
  <p class="lead">One more step to secure your account.</p>
  <div class="box"><small>Verification code sent to</small><b id="mail"></b><p>Use the 6-digit code to verify your email.</p></div>
  <button class="btn p mt" id="enter">Enter verification code</button>
  <button class="link" id="change">Wrong email? Change email</button>
  <p class="note">Can’t find the email? Check your spam folder.<br>Your code is valid for 10 minutes.</p>
</div>
<p class="help">Need help? <a id="support">Contact support</a></p>
<div class="toast" id="toast" role="status"></div>
</div>
<script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),email=q.get('email')||'alex.morgan@email.com',name=q.get('name')||'';
let tt;const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1600)};
const back=()=>location.href=`SignUpC.html?email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}`;
$('mail').textContent=email;
$('enter').addEventListener('click',()=>location.href=`VerifyC.html?email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}`);
$('back').addEventListener('click',back);$('change').addEventListener('click',back);
$('support').addEventListener('click',()=>toast('Support center (contoh)'));
</script>
</body>
</html>
