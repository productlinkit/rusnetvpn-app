<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A0D17">
<title>RusnetVPN · Splash</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
background:radial-gradient(110% 70% at 85% 0%,rgba(255,90,78,.55) 0%,transparent 60%),linear-gradient(170deg,#7A0D17 0%,#B3121F 55%,#E11D2E 100%);
display:flex;align-items:center;justify-content:center;cursor:pointer}
.stage{position:relative;display:flex;align-items:center;justify-content:center}
.logo{position:absolute;margin:0;font-weight:700;font-size:52px;letter-spacing:-.035em;line-height:1.2;color:#fff;white-space:nowrap}
.logo span{background:linear-gradient(135deg,#FFE1DE,#FFB3AA);-webkit-background-clip:text;background-clip:text;color:transparent}
/* timeline */
.sp-shield{position:relative;z-index:1;animation:spIn .55s cubic-bezier(.2,.9,.3,1.35) both,spOut .4s ease-in 2.05s forwards}
.sp-grad{opacity:0;animation:fadeTo .5s ease 1.25s forwards}
.sp-check{stroke-dasharray:90;stroke-dashoffset:90;animation:draw .45s cubic-bezier(.6,0,.2,1) .7s forwards}
.sp-glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,190,.5),transparent 65%);opacity:0;animation:glow 1.3s ease 1.2s forwards}
.sp-logo{opacity:0;animation:logoIn .65s cubic-bezier(.2,.8,.2,1) 2.3s forwards}
@keyframes spIn{from{opacity:0;transform:scale(.4) rotate(-8deg)}}
@keyframes spOut{to{opacity:0;transform:scale(.55) translateY(-8px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeTo{to{opacity:1}}
@keyframes glow{0%{opacity:0;transform:scale(.6)}50%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
@keyframes logoIn{from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sp-shield{display:none}.sp-logo{opacity:1}}
</style>
</head>
<body>
<div class="stage" id="stage" role="img" aria-label="RusnetVPN">
  <div class="sp-glow"></div>
  <div class="sp-shield">
    <img src="img/rusnet-mark-white.png" alt="" style="width:84px;height:auto;display:block">
  </div>
  <img class="logo sp-logo" src="img/rusnet-logo-white.png" alt="RusnetVPN" style="height:60px;width:auto">
</div>
<script>
// Ketuk layar untuk memutar ulang animasi
document.body.addEventListener('click',()=>{const s=document.getElementById('stage'),c=s.cloneNode(true);s.replaceWith(c)});
</script>
</body>
</html>
