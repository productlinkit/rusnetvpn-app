<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>RusnetVPN</title>
<link rel="icon" href="img/rusnet-mark.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E11D2E;--red-d:#9B1220;--red-t:#C70F21;--grad:linear-gradient(135deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);--ink:#17121A;--sub:#6B5E63;--faint:#B9AEB2;--line:#E8D9DB;--err:#C70F21;
  --pink:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 60%,#FFF5F3 100%);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@property --x{syntax:'<percentage>';inherits:true;initial-value:16.667%}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
@media (min-width:481px){body{background:#F1ECED}}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #B3121F;outline-offset:3px}
a{color:var(--red-t);text-decoration:none;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.flag{flex:none;overflow:hidden;box-shadow:0 0 0 1px rgba(15,23,42,.08)}
.f-au{background:radial-gradient(circle at 74% 64%,#fff 0 1.6px,transparent 2.2px),radial-gradient(circle at 86% 40%,#fff 0 1.4px,transparent 2px),radial-gradient(circle at 26% 76%,#fff 0 2.4px,transparent 3px),linear-gradient(transparent 21%,#E4002B 21% 29%,transparent 29%) 0 0/50% 50% no-repeat,linear-gradient(90deg,transparent 44%,#E4002B 44% 56%,transparent 56%) 0 0/50% 50% no-repeat,linear-gradient(transparent 17%,#fff 17% 33%,transparent 33%) 0 0/50% 50% no-repeat,linear-gradient(90deg,transparent 38%,#fff 38% 62%,transparent 62%) 0 0/50% 50% no-repeat,#012169}
.f-at{background:linear-gradient(#ED2939 0 33%,#fff 33% 66%,#ED2939 66%)}
.f-be{background:linear-gradient(90deg,#111 0 33%,#FAE042 33% 66%,#ED2939 66%)}
.f-bg{background:linear-gradient(#fff 0 33%,#00966E 33% 66%,#D62612 66%)}
.f-ca{background:radial-gradient(circle,#D52B1E 0 5px,transparent 5.5px),linear-gradient(90deg,#D52B1E 0 25%,#fff 25% 75%,#D52B1E 75%)}
.f-cl{background:radial-gradient(circle at 20% 25%,#fff 0 2px,transparent 2.6px),linear-gradient(#0039A6,#0039A6) 0 0/38% 50% no-repeat,linear-gradient(#fff 0 50%,#D52B1E 50%)}
.f-cn{background:radial-gradient(circle at 24% 34%,#FFDE00 0 4px,transparent 4.6px),radial-gradient(circle at 44% 18%,#FFDE00 0 1.3px,transparent 1.8px),radial-gradient(circle at 48% 44%,#FFDE00 0 1.3px,transparent 1.8px),#DE2910}
.f-cr{background:linear-gradient(#002B7F 0 17%,#fff 17% 33%,#CE1126 33% 67%,#fff 67% 83%,#002B7F 83%)}
.f-cz{background:linear-gradient(to right bottom,#11457E 50%,transparent 50%) 0 0/50% 50% no-repeat,linear-gradient(to right top,#11457E 50%,transparent 50%) 0 100%/50% 50% no-repeat,linear-gradient(#fff 0 50%,#D7141A 50%)}
.f-dk{background:linear-gradient(90deg,transparent 0 30%,#fff 30% 42%,transparent 42%),linear-gradient(transparent 0 40%,#fff 40% 60%,transparent 60%),#C8102E}
.f-us{background:linear-gradient(#3C3B6E,#3C3B6E) 0 0/44% 54% no-repeat,repeating-linear-gradient(#B22234 0 2px,#fff 2px 4px)}
.f-gb{background:linear-gradient(transparent 40%,#C8102E 40% 60%,transparent 60%),linear-gradient(90deg,transparent 44%,#C8102E 44% 56%,transparent 56%),linear-gradient(transparent 32%,#fff 32% 68%,transparent 68%),linear-gradient(90deg,transparent 38%,#fff 38% 62%,transparent 62%),#012169}
.f-jp{background:radial-gradient(circle,#BC002D 0 7px,transparent 7.6px),#fff}
.f-de{background:linear-gradient(#111 0 33%,#DD0000 33% 66%,#FFCE00 66%)}
.f-sg{background:radial-gradient(circle at 24% 26%,#fff 0 4px,transparent 4.6px),radial-gradient(circle at 30% 26%,#EF3340 0 4px,transparent 4.6px),linear-gradient(#EF3340 0 50%,#fff 50%)}
.f-ch{background:linear-gradient(transparent 40%,#fff 40% 60%,transparent 60%) 50% 50%/50% 70% no-repeat,linear-gradient(90deg,transparent 40%,#fff 40% 60%,transparent 60%) 50% 50%/70% 50% no-repeat,#DA291C}

/* ===== shell: one full-screen column, no rounded frame ===== */
#app{position:fixed;inset:0;margin:0 auto;max-width:480px;overflow:hidden;background:#fff}
#view{position:absolute;inset:0}
.scr{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;animation:scrIn .38s cubic-bezier(.2,.8,.2,1) both}
.scr::-webkit-scrollbar{display:none}
.scr.out{animation:scrOut .25s ease both;pointer-events:none;z-index:0}
.scr.tab{animation-name:scrFade}
@keyframes scrIn{from{opacity:0;transform:translateX(22px)}}
@keyframes scrFade{from{opacity:0}}
@keyframes scrOut{to{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes popIn{from{opacity:0;transform:scale(.5)}}

/* shared nav: dark bar, notch follows the active tab */
.nv{position:absolute;left:16px;right:16px;bottom:calc(16px + var(--sb));height:70px;display:flex;z-index:5;--x:16.667%;transition:--x .45s cubic-bezier(.3,.8,.3,1),opacity .3s,transform .35s cubic-bezier(.3,.8,.3,1)}
.nv[hidden]{display:flex;opacity:0;transform:translateY(120px);pointer-events:none}
.nv-bar{position:absolute;inset:0;border-radius:24px;background:#1C171D;-webkit-mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px);mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px)}
.nv-bub{position:absolute;left:var(--x);top:-22px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:var(--grad);box-shadow:0 12px 22px -8px rgba(200,16,46,.7)}
.nv button{position:relative;flex:1;border:0;background:none;color:#A39BA0;display:flex;flex-direction:column;align-items:center;padding-top:22px;gap:5px;font:500 11px 'Plus Jakarta Sans',sans-serif}
.nv button svg{width:24px;height:24px;transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.nv button.on{color:#fff;font-weight:700}.nv button.on svg{transform:translateY(-27px)}
.nv button:focus-visible{outline:2px solid #fff;outline-offset:-6px}
.nv.still,.nv.still *{transition:none!important}

#app:after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(118px + var(--sb));z-index:4;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0),var(--fade,#fff) 72%);opacity:0;transition:opacity .3s}
#app.tabs:after{opacity:1}

/* toast + bottom sheet */
.toast{position:absolute;left:50%;top:calc(18px + var(--st));z-index:20;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:11px 16px;border-radius:999px;background:#1C171D;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translate(-50%,-12px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.3,.8,.3,1)}
#app.tabs .toast{top:auto;bottom:calc(104px + var(--sb));transform:translate(-50%,12px)}
.toast.show{transform:translate(-50%,0)!important;opacity:1}
.dim{position:absolute;inset:0;z-index:30;background:rgba(23,18,26,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;padding:12px 20px calc(28px + var(--sb));border-radius:30px 30px 0 0;background:#fff;transform:translateY(105%);transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.sheet:before{content:"";display:block;width:40px;height:5px;margin:0 auto 18px;border-radius:9px;background:#E8DCDE}
#app.sheeted .dim{opacity:1;pointer-events:auto}#app.sheeted .sheet{transform:none}
.sheet h2{margin:0 0 6px;font-size:20px;font-weight:700}
.sheet p{margin:0 0 18px;font-size:14px;color:var(--sub);line-height:1.5}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:10px;border-radius:18px;border:1.5px solid #F0E3E5;background:#fff;text-align:left}
.opt .tx{flex:1;display:flex;flex-direction:column;gap:2px}.opt .tx b{font-size:15px}.opt .tx small{font-size:12px;color:var(--sub)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #E3D3D6;flex:none;transition:.2s}
.opt.sel{border-color:var(--red);background:#FFF5F4}.opt.sel .rd{border:7px solid var(--red)}
.btns{display:flex;gap:10px;margin-top:6px}

/* buttons used across screens */
.btn{position:relative;width:100%;height:54px;border:0;border-radius:20px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;flex:1}
.btn.p{background:linear-gradient(115deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);color:#fff;box-shadow:0 16px 26px -16px rgba(179,18,31,.9)}
.btn.p:active{transform:scale(.98)}
.btn.o{background:#fff;border:1px solid var(--line)}
.btn.o.red{color:var(--red-t)}
.btn.g{background:#F6EEEF}
.btn .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}

/* ===== splash ===== */
.s-splash{overflow:hidden;background:radial-gradient(70% 40% at 50% 44%,rgba(255,138,128,.12),transparent 70%),var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:none}
.s-splash .orb{position:relative;width:150px;height:150px;margin-top:-60px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 34% 26%,#FFB1A8 0%,#FF5A4E 22%,#E11D2E 52%,#9B1220 82%,#6E0A14 100%);box-shadow:inset 0 -16px 34px rgba(60,5,10,.45),inset 0 10px 22px rgba(255,255,255,.35),0 40px 60px -26px rgba(155,18,32,.85);animation:spOrb .9s cubic-bezier(.2,.9,.3,1.3) both}
.s-splash .orb:before{content:"";position:absolute;left:22%;top:9%;width:48%;height:24%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0))}
.s-splash .mk{position:relative;width:72px;height:auto;filter:drop-shadow(0 6px 10px rgba(60,5,10,.35));animation:spMark .6s cubic-bezier(.2,.9,.3,1.4) .45s both}
.s-splash .rip{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(225,29,46,.35);opacity:0;animation:spRip 2.4s cubic-bezier(.2,.7,.3,1) .9s infinite}
.s-splash .rip.r2{animation-delay:1.7s}
.s-splash .halo{position:absolute;inset:-18px;border-radius:50%;background:conic-gradient(from 0deg,rgba(225,29,46,0),rgba(225,29,46,.6),rgba(255,138,128,.1),rgba(225,29,46,0));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));animation:spFade .5s ease 1.1s both,spin 1.6s linear 1.1s infinite}
.s-splash .shadow{width:120px;height:20px;margin-top:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(122,13,23,.3),transparent);animation:spFade .8s ease .4s both}
.s-splash .word{margin:30px 0 0;overflow:hidden;line-height:0}
.s-splash .word img{height:34px;width:auto;animation:spWipe .8s cubic-bezier(.6,0,.2,1) 1.35s both}
.s-splash .tag{margin:10px 0 0;font-size:14px;font-weight:500;color:var(--sub);animation:spFade .6s ease 1.9s both}
.s-splash .load{position:absolute;left:50%;bottom:calc(70px + var(--sb));width:120px;height:4px;margin-left:-60px;border-radius:9px;background:rgba(155,18,32,.12);overflow:hidden;animation:spFade .4s ease 1.9s both}
.s-splash .load i{display:block;height:100%;width:0;border-radius:9px;background:var(--grad);animation:spBar 1s cubic-bezier(.5,0,.3,1) 2s forwards}
.s-splash .ver{position:absolute;left:0;right:0;bottom:calc(36px + var(--sb));text-align:center;font-size:11px;font-weight:500;color:var(--faint);animation:spFade .6s ease 2s both}
@keyframes spOrb{from{opacity:0;transform:scale(.3)}}
@keyframes spMark{from{opacity:0;transform:scale(.4) rotate(-12deg)}}
@keyframes spFade{from{opacity:0}}
@keyframes spRip{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(2.6)}}
@keyframes spWipe{from{clip-path:inset(0 100% 0 0);transform:translateY(40%)}}
@keyframes spBar{to{width:100%}}

/* ===== welcome ===== */
.s-welcome{overflow:hidden;background:#F8F9FB}
.s-welcome .track{position:absolute;left:0;top:0;bottom:calc(200px + var(--sb));display:flex;width:300%;transition:transform .55s cubic-bezier(.3,.8,.3,1);touch-action:pan-y}
.s-welcome .track.drag{transition:none}
.s-welcome .sl{width:33.3334%;display:flex;flex-direction:column;align-items:center;padding:calc(50px + var(--st)) 32px 0}
.s-welcome .card{position:relative;width:min(288px,100%);aspect-ratio:572/767;border-radius:36px;overflow:hidden;flex:none;background:#E9E4E6;box-shadow:0 0 90px 10px rgba(255,90,78,.12),0 30px 50px -34px rgba(60,10,15,.55)}
.s-welcome .card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.s-welcome .sl.on .card img{animation:wcZoom 6s cubic-bezier(.2,.6,.3,1) both}
.s-welcome .copy{margin-top:34px;text-align:center}
.s-welcome .sl .copy>*{opacity:0}
.s-welcome .sl.on .copy>*{opacity:1;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.s-welcome .sl.on .copy>*:nth-child(2){animation-delay:.08s}
.s-welcome .logo{height:38px;width:auto;display:block;margin:30px auto 0}
.s-welcome h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.28}
.s-welcome h1 em{font-style:normal;color:var(--red)}
.s-welcome .copy p{margin:12px auto 0;max-width:300px;font-size:15px;line-height:1.55;color:#4B5563}
.s-welcome .sl:first-child .copy p{margin-top:16px;font-size:14.5px}
.s-welcome .ctl{position:absolute;left:32px;right:32px;bottom:calc(30px + var(--sb))}
.s-welcome .prog{display:flex;align-items:center;justify-content:space-between;margin:0 8px 26px}
.s-welcome .dots{display:flex;gap:7px}
.s-welcome .dots button{width:7px;height:7px;padding:0;border:0;border-radius:99px;background:#CBD2DC;transition:width .35s cubic-bezier(.3,.8,.3,1),background .3s}
.s-welcome .dots button.on{width:28px;background:linear-gradient(90deg,#FF3B2F,#E8263F)}
.s-welcome .step{font-size:13px;font-weight:500;color:#6B7280;font-variant-numeric:tabular-nums}
.s-welcome .go{height:56px;border-radius:24px;background:linear-gradient(90deg,#FF3B2F 0%,#E8263F 55%,#DC1A4B 100%);color:#fff;font-size:17px;gap:12px;overflow:hidden;box-shadow:0 18px 30px -16px rgba(232,38,63,.75)}
.s-welcome .go:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:wcShine 3.2s ease-in-out 1s infinite}
.s-welcome .go svg{stroke-width:2.2}
.s-welcome .alt{display:block;margin:18px auto 0;border:0;background:none;font-size:14px;font-weight:500;color:#4B5563;padding:6px}
.s-welcome .alt b{color:var(--red);font-weight:700;margin-left:2px}
@keyframes wcZoom{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes wcShine{0%,60%{left:-40%}100%{left:130%}}
@media (max-height:780px){.s-welcome .sl{padding-top:calc(28px + var(--st))}.s-welcome .card{width:min(236px,100%)}.s-welcome .copy{margin-top:22px}.s-welcome .logo{margin-top:18px}}
@media (max-height:680px){.s-welcome .card{width:min(190px,100%)}.s-welcome h1{font-size:21px}}

/* ===== sign up / log in / check email / verify ===== */
.s-auth{background:#fff;padding:calc(40px + var(--st)) 24px calc(32px + var(--sb))}
.s-auth>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.s-auth>*:nth-child(2){animation-delay:.04s}.s-auth>*:nth-child(3){animation-delay:.08s}.s-auth>*:nth-child(n+4){animation-delay:.12s}
.s-auth .logo{display:block;height:33px;width:auto;margin-left:4px}
.s-auth h1{margin:36px 0 0;font-size:29px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.s-auth .lead{margin:10px 0 0;font-size:15px;color:var(--sub)}
.s-auth form{margin-top:30px}
.s-auth .f{margin-bottom:18px}
.s-auth label{display:block;font-size:14px;font-weight:600;margin-bottom:9px}
.s-auth .lrow{display:flex;justify-content:space-between;align-items:baseline}
.s-auth .lrow a{font-size:13px;font-weight:600}
.s-auth .in{position:relative;display:flex;align-items:center;height:52px;border:1px solid var(--line);border-radius:18px;background:#fff;transition:border-color .2s,box-shadow .2s}
.s-auth .in:focus-within{border-color:var(--red);box-shadow:0 0 0 4px rgba(225,29,46,.1)}
.s-auth .in input{flex:1;height:100%;min-width:0;border:0;background:none;outline:none;padding:0 16px;font-size:15px}
.s-auth .in input::placeholder{color:#8A7F84}
.s-auth .eye{width:48px;height:48px;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center}
.s-auth .f.bad .in{border-color:var(--err);animation:shake .35s}
.s-auth .hint{margin:9px 0 0;font-size:12.5px;color:var(--sub)}
.s-auth .f.bad .hint{color:var(--err)}
.s-auth .f.good .hint{color:#15803D}
.s-auth .terms{margin:4px 0 18px;font-size:12.5px;line-height:1.5;color:var(--sub)}
.s-auth .btn.o{margin-top:12px}
.s-auth .or{display:flex;align-items:center;gap:12px;margin:22px 0 10px;font-size:13px;color:var(--sub)}
.s-auth .or:before,.s-auth .or:after{content:"";flex:1;height:1px;background:var(--line)}
.s-auth .foot{margin:24px 0 0;text-align:center;font-size:14px;color:var(--sub)}
.s-auth .foot a{font-weight:700;margin-left:6px}
.s-auth .back{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font-size:15px;font-weight:500}
.s-auth .back svg{width:16px;height:16px;stroke-width:2.4}
.s-auth .tile{width:64px;height:64px;margin-top:40px;border-radius:22px;background:#FFF1F2;color:var(--red-t);display:flex;align-items:center;justify-content:center}
.s-auth .tile svg{width:30px;height:30px;stroke-width:2}
.s-auth .tile .flap{transform-origin:50% 20%;animation:auFlap 1.6s ease-in-out .6s 2}
@keyframes auFlap{50%{transform:scaleY(.4)}}
.s-auth .box{margin-top:30px;padding:20px 16px;border-radius:22px;background:#FFF7F7}
.s-auth .box small{display:block;font-size:13px;color:var(--sub)}
.s-auth .box b{display:block;margin:10px 0;font-size:17px;font-weight:700;word-break:break-all}
.s-auth .box p{margin:0;font-size:13px;color:var(--sub)}
.s-auth .mt{margin-top:32px}
.s-auth .link{display:block;margin:22px auto 0;border:0;background:none;font-size:15px;font-weight:500;color:var(--red-t);padding:4px}
.s-auth .note{margin:56px 0 0;text-align:center;font-size:13px;line-height:1.5;color:var(--sub)}
.s-auth .help{margin:48px 0 0;text-align:center;font-size:13px;color:var(--sub)}
.s-auth .help a{color:var(--sub)}
.s-auth .to{margin:8px 0 0;font-size:15px;font-weight:500;word-break:break-all}
.s-auth .otp{display:flex;gap:8px}
.s-auth .otp input{flex:1;min-width:0;height:58px;border:1px solid #E5C9D0;border-radius:16px;text-align:center;font-size:24px;font-weight:500;outline:none;background:#fff;caret-color:var(--red);transition:border-color .2s,box-shadow .2s}
.s-auth .otp input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(225,29,46,.1)}
.s-auth .otp input.fill{border-color:#D8A6B0;animation:auPop .2s ease}
@keyframes auPop{50%{transform:scale(1.08)}}
.s-auth .otp.bad input{border-color:var(--err);animation:shake .35s}
.s-auth .otp.ok input{border-color:#16A34A;background:#F0FDF4;color:#15803D}
.s-auth .exp{margin:12px 0 0;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.s-auth .exp.err{color:var(--err)}
.s-auth .resend{display:block;margin:22px auto 0;border:0;background:none;font-size:15px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums;padding:4px}
.s-auth .resend.on{color:var(--red-t);font-weight:700}
.s-auth .resend+.link{margin-top:14px}
.s-auth .box.tip{margin-top:44px}
.s-auth .box.tip b{margin:0 0 8px;font-size:15px}

/* ===== home ===== */

const view=$('#view'),nav=$('#nav'),TABS=['home','servers','menu'],AUTH=['welcome','signup','login','check','verify','forgot'];
let cur=null,timers=[],depth=0;
const T={every:(f,ms)=>{const id=setInterval(f,ms);timers.push(()=>clearInterval(id))},after:(f,ms)=>{const id=setTimeout(f,ms);timers.push(()=>clearTimeout(id))}};
function go(name,params={},mode='push'){
  if(TABS.includes(name)&&!user)name='welcome';            // signed out → start of the flow
  if(AUTH.includes(name)&&user&&!user.guest)name='home';     // already signed in → skip auth
  if(['account','paid','checkout'].includes(name)&&(!user||user.guest))name=user?'menu':'welcome';
  if(['connection','notif','support','chat','about','terms','plans'].includes(name)&&!user)name='welcome';
  timers.forEach(f=>f());timers=[];closeSheet(true);coach.end(true);VPN.subs.clear();
  const S=SCREENS[name],wasTab=cur&&TABS.includes(cur.name),isTab=TABS.includes(name);
  const el=document.createElement('section');
  el.className=`scr s-${name}${S.cls?' '+S.cls:''}${isTab&&wasTab?' tab':''}`;
  el.innerHTML=S.html(params);
  const old=view.firstElementChild;
  if(old){$$('.scr',view).forEach(o=>{o.classList.add('out');setTimeout(()=>o.remove(),260)})}
  view.appendChild(el);
  // nav: slides the notch between tabs, rises in when the tabs first appear
  app.classList.toggle('tabs',isTab);app.style.setProperty('--fade',S.fade||'#fff');
  if(isTab){const k=TABS.indexOf(name);if(!wasTab)nav.classList.add('still');
    nav.style.setProperty('--x',((k+.5)/3*100).toFixed(3)+'%');
    $$('button',nav).forEach(b=>{const on=b.dataset.tab===name;b.classList.toggle('on',on);b.toggleAttribute('aria-current',on)});
    nav.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>nav.classList.remove('still')))}
  else nav.hidden=true;
  cur={name,params};
  if(mode==='push'){history.pushState(cur,'');depth++}else if(mode==='replace')history.replaceState(cur,'');
  document.title=S.title?S.title+' · RusnetVPN':'RusnetVPN';
  S.init&&S.init(el,params);
}
addEventListener('popstate',e=>{depth=Math.max(0,depth-1);const s=e.state;if(s&&s.name!=='splash')go(s.name,s.params,'none')});
const back=parent=>depth>0?history.back():go(parent,{},'replace');
$$('button',nav).forEach(b=>b.addEventListener('click',()=>{if(b.dataset.tab!==cur.name)go(b.dataset.tab)}));

      $('.step',r).textContent=`Step ${i+1} of 3`};
    this.key=e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)};
    $('.go',r).addEventListener('click',()=>i<2?show(i+1):go('signup'));
    $('.alt',r).addEventListener('click',()=>go('login'));
    dots.forEach((d,n)=>d.addEventListener('click',()=>show(n)));
    let x0=null,dx=0;
    track.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;track.classList.add('drag');track.setPointerCapture(e.pointerId)});
    track.addEventListener('pointermove',e=>{if(x0==null)return;dx=e.clientX-x0;track.style.transform=`translateX(calc(${-i*100/3}% + ${dx}px))`});
    const end=()=>{if(x0==null)return;track.classList.remove('drag');x0=null;show(Math.abs(dx)>50?i+(dx<0?1:-1):i)};
    track.addEventListener('pointerup',end);track.addEventListener('pointercancel',end);
    show(p.step||0)}};

    const clear=()=>ins.forEach(x=>{x.value='';x.classList.remove('fill')});
    const fillFrom=(k,d)=>{for(const c of d){if(k>5)break;ins[k].value=c;ins[k].classList.add('fill');k++}ins[Math.min(k,5)].focus();box.classList.remove('bad');if(code().length===6)submit()};
    ins.forEach((x,k)=>{

function confirmSheet(title,text,yes,fn){

    $('.js-email',r).addEventListener('click',()=>{openSheet(`<h2 id="shT">Email support</h2><p>Tell us what’s going on and we’ll reply to ${esc(user&&user.email||'your email')}.</p><textarea class="ta" placeholder="Describe your issue…" aria-label="Message"></textarea><div class="btns"><button class="btn p js-send">Send message</button></div>`);
      setTimeout(()=>$('#sheet textarea').focus(),380);
      $('#sheet .js-send').addEventListener('click',e=>{if($('#sheet textarea').value.trim().length<5){toast('Please write a little more');return}busy(e.currentTarget);setTimeout(()=>{closeSheet(true);toast('Message sent. We’ll reply soon')},900)})})}};

const BOT=[[/slow|speed|lag/i,'Sorry about that! Try tapping “Fastest server” in the Server List, or switch the protocol to WireGuard in Menu › Protocol.'],
  [/log|privacy|track/i,'We run a strict no-logs policy. Your browsing is never stored or shared.'],
  [/premium|price|pay|plan|cancel/i,'Premium starts at $4.99/month on the 12-month plan. You can upgrade or cancel any time in Menu › My subscription.'],
  [/connect|not working|fail/i,'Please check your internet, then try another server. If it still fails, turn the kill switch off and on again.']];
SCREENS.chat={title:'Live chat',cls:'s-sub s-chat',html:()=>`
<div class="bar"><button class="bk js-bk" aria-label="Back">${ic('left')}</button><div class="ttl"><h1>Live chat</h1><small>Rusnet Support · Online</small></div></div>
<div class="msgs" aria-live="polite"><span class="day">Today</span><div class="m them">Hi${firstName()?' '+esc(firstName()):''}! 👋 I’m Rina from RusnetVPN Support. How can I help you today?</div></div>
<div class="quick">${['Connection is slow','Do you keep logs?','Premium price','Can’t connect'].map(q=>`<button>${q}</button>`).join('')}</div>
<form><input placeholder="Type a message…" aria-label="Message" autocomplete="off"><button type="submit" aria-label="Send">${ic('send','width:20px;height:20px')}</button></form>`,
  init(r){wire(r,'support');const box=$('.msgs',r),inp=$('form input',r);
    const add=(t,who)=>{box.insertAdjacentHTML('beforeend',`<div class="m ${who}">${esc(t)}</div>`);box.scrollTop=box.scrollHeight};
    const send=t=>{t=t.trim();if(!t)return;add(t,'me');inp.value='';
      box.insertAdjacentHTML('beforeend','<div class="typing" aria-label="Support is typing"><i></i><i></i><i></i></div>');box.scrollTop=box.scrollHeight;
      T.after(()=>{$('.typing',box)?.remove();add((BOT.find(([re])=>re.test(t))||[0,'Thanks! A support agent will look into this and reply here shortly.'])[1],'them')},1300)};
    $('form',r).addEventListener('submit',e=>{e.preventDefault();send(inp.value)});
    $$('.quick button',r).forEach(b=>b.addEventListener('click',()=>send(b.textContent)))}};

        $('.js-done',r).addEventListener('click',()=>go('login',{email},'replace'));$('.js-again',r).addEventListener('click',()=>toast('Reset link sent again'))},900)})}};
