<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>RusnetVPN</title>
<link rel="icon" href="img/rusnet-mark.png?v=3">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E11D2E;--red-d:#9B1220;--red-t:#C70F21;--grad:linear-gradient(135deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);--ink:#17121A;--sub:#6B5E63;--faint:#B9AEB2;--line:#E8D9DB;--err:#C70F21;
  --pink:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 60%,#FFF5F3 100%);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@property --x{syntax:'<percentage>';inherits:true;initial-value:16.667%}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
@media (min-width:481px){body{background:#F1ECED}}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #B3121F;outline-offset:3px}
a{color:var(--red-t);text-decoration:none;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.flag{flex:none;overflow:hidden;box-shadow:0 0 0 1px rgba(15,23,42,.08)}
.f-ru{background:linear-gradient(#fff 0 33.3%,#0039A6 33.3% 66.6%,#D52B1E 66.6%)}
.f-kz{background:radial-gradient(circle,#FEC50C 0 4.5px,transparent 5px),linear-gradient(90deg,transparent 0 7%,#FEC50C 7% 12%,transparent 12%),#00AFCA}
.f-tr{background:radial-gradient(circle at 60% 50%,#fff 0 1.8px,transparent 2.3px),radial-gradient(circle at 44% 50%,#E30A17 0 5.4px,transparent 5.9px),radial-gradient(circle at 38% 50%,#fff 0 6.6px,transparent 7.1px),#E30A17}
.f-ae{background:linear-gradient(90deg,#FF0000 0 26%,transparent 26%),linear-gradient(#00732F 0 33.3%,#fff 33.3% 66.6%,#000 66.6%)}
.f-am{background:linear-gradient(#D90012 0 33.3%,#0033A0 33.3% 66.6%,#F2A800 66.6%)}
.f-rs{background:radial-gradient(circle at 30% 45%,#fff 0 1.8px,#C6363C 1.8px 4.2px,transparent 4.7px),linear-gradient(#C6363C 0 33.3%,#0C4076 33.3% 66.6%,#fff 66.6%)}
.f-in{background:radial-gradient(circle,transparent 0 2.4px,#000080 2.4px 3.6px,transparent 4px),linear-gradient(#FF9933 0 33.3%,#fff 33.3% 66.6%,#138808 66.6%)}
.f-id{background:linear-gradient(#CE1126 0 50%,#fff 50%)}
.f-my{background:radial-gradient(circle at 37% 28%,#FFCC00 0 1.7px,transparent 2.2px),radial-gradient(circle at 23% 28%,#010066 0 3px,transparent 3.5px),radial-gradient(circle at 19% 28%,#FFCC00 0 3.8px,transparent 4.3px),linear-gradient(#010066,#010066) 0 0/50% 57% no-repeat,repeating-linear-gradient(#CC0001 0 7.14%,#fff 7.14% 14.28%)}
.f-th{background:linear-gradient(#A51931 0 16.6%,#F4F5F8 16.6% 33.3%,#2D2A4A 33.3% 66.6%,#F4F5F8 66.6% 83.3%,#A51931 83.3%)}
.f-br{background:radial-gradient(circle,#002776 0 4.6px,transparent 5.1px),radial-gradient(ellipse 40% 36% at 50% 50%,#FEDF00 0 98%,transparent 100%),#009C3B}
.f-ar{background:radial-gradient(circle,#F6B40E 0 2.8px,transparent 3.3px),linear-gradient(#74ACDF 0 33.3%,#fff 33.3% 66.6%,#74ACDF 66.6%)}
.f-za{background:conic-gradient(from 0deg at 40% 50%,transparent 0 212deg,#fff 212deg 216deg,#007749 216deg 222deg,#FFB81C 222deg 228deg,#000 228deg 312deg,#FFB81C 312deg 318deg,#007749 318deg 324deg,#fff 324deg 328deg,transparent 328deg),linear-gradient(transparent 0 33%,#fff 33% 38%,#007749 38% 62%,#fff 62% 67%,transparent 67%),linear-gradient(#E03C31 0 50%,#001489 50%)}
.f-uz{background:radial-gradient(circle at 17% 17%,#0099B5 0 2.6px,transparent 3px),radial-gradient(circle at 13% 17%,#fff 0 3px,transparent 3.5px),linear-gradient(#0099B5 0 32%,#CE1126 32% 34.5%,#fff 34.5% 65.5%,#CE1126 65.5% 68%,#1EB53A 68%)}

/* ===== shell: one full-screen column, no rounded frame ===== */
#app{position:fixed;inset:0;margin:0 auto;max-width:480px;overflow:hidden;background:#fff}
#view{position:absolute;inset:0}
.scr{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;animation:scrIn .38s cubic-bezier(.2,.8,.2,1) both}
.scr::-webkit-scrollbar{display:none}
.scr.out{animation:scrOut .25s ease both;pointer-events:none;z-index:0}
.scr.tab{animation-name:scrFade}
@keyframes scrIn{from{opacity:0;transform:translateX(22px)}}
@keyframes scrFade{from{opacity:0}}
@keyframes scrOut{to{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes popIn{from{opacity:0;transform:scale(.5)}}

/* shared nav: dark bar, notch follows the active tab */
.nv{position:absolute;left:16px;right:16px;bottom:calc(16px + var(--sb));height:70px;display:flex;z-index:5;--x:16.667%;transition:--x .45s cubic-bezier(.3,.8,.3,1),opacity .3s,transform .35s cubic-bezier(.3,.8,.3,1)}
.nv[hidden]{display:flex;opacity:0;transform:translateY(120px);pointer-events:none}
.nv-bar{position:absolute;inset:0;border-radius:24px;background:#1C171D;-webkit-mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px);mask:radial-gradient(circle at var(--x) 6px,transparent 37px,#000 38px)}
.nv-bub{position:absolute;left:var(--x);top:-22px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:var(--grad);box-shadow:0 12px 22px -8px rgba(200,16,46,.7)}
.nv button{position:relative;flex:1;border:0;background:none;color:#A39BA0;display:flex;flex-direction:column;align-items:center;padding-top:22px;gap:5px;font:500 11px 'Plus Jakarta Sans',sans-serif}
.nv button svg{width:24px;height:24px;transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.nv button.on{color:#fff;font-weight:700}.nv button.on svg{transform:translateY(-27px)}
.nv button:focus-visible{outline:2px solid #fff;outline-offset:-6px}
.nv.still,.nv.still *{transition:none!important}

#app:after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(118px + var(--sb));z-index:4;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0),var(--fade,#fff) 72%);opacity:0;transition:opacity .3s}
#app.tabs:after{opacity:1}

/* toast + bottom sheet */
.toast{position:absolute;left:50%;top:calc(18px + var(--st));z-index:20;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:11px 16px;border-radius:999px;background:#1C171D;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translate(-50%,-12px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.3,.8,.3,1)}
#app.tabs .toast{top:auto;bottom:calc(104px + var(--sb));transform:translate(-50%,12px)}
.toast.show{transform:translate(-50%,0)!important;opacity:1}
.dim{position:absolute;inset:0;z-index:30;background:rgba(23,18,26,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;padding:12px 20px calc(28px + var(--sb));border-radius:30px 30px 0 0;background:#fff;transform:translateY(105%);transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.sheet:before{content:"";display:block;width:40px;height:5px;margin:0 auto 18px;border-radius:9px;background:#E8DCDE}
#app.sheeted .dim{opacity:1;pointer-events:auto}#app.sheeted .sheet{transform:none}
.sheet h2{margin:0 0 6px;font-size:20px;font-weight:700}
.sheet p{margin:0 0 18px;font-size:14px;color:var(--sub);line-height:1.5}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:10px;border-radius:18px;border:1.5px solid #F0E3E5;background:#fff;text-align:left}
.opt .tx{flex:1;display:flex;flex-direction:column;gap:2px}.opt .tx b{font-size:15px}.opt .tx small{font-size:12px;color:var(--sub)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #E3D3D6;flex:none;transition:.2s}
.opt.sel{border-color:var(--red);background:#FFF5F4}.opt.sel .rd{border:7px solid var(--red)}
.btns{display:flex;gap:10px;margin-top:6px}

/* buttons used across screens */
.btn{position:relative;width:100%;height:54px;border:0;border-radius:20px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;flex:1}
.btn.p{background:linear-gradient(115deg,#B3121F 0%,#E11D2E 52%,#FF5A4E 100%);color:#fff;box-shadow:0 16px 26px -16px rgba(179,18,31,.9)}
.btn.p:active{transform:scale(.98)}
.btn.o{background:#fff;border:1px solid var(--line)}
.btn.o.red{color:var(--red-t)}
.btn.g{background:#F6EEEF}
.btn .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}

/* ===== splash ===== */
.s-splash{overflow:hidden;background:radial-gradient(70% 40% at 50% 44%,rgba(255,138,128,.12),transparent 70%),var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:none}
.s-splash .orb{position:relative;width:150px;height:150px;margin-top:-60px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 34% 26%,#FFB1A8 0%,#FF5A4E 22%,#E11D2E 52%,#9B1220 82%,#6E0A14 100%);box-shadow:inset 0 -16px 34px rgba(60,5,10,.45),inset 0 10px 22px rgba(255,255,255,.35),0 40px 60px -26px rgba(155,18,32,.85);animation:spOrb .9s cubic-bezier(.2,.9,.3,1.3) both}
.s-splash .orb:before{content:"";position:absolute;left:22%;top:9%;width:48%;height:24%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0))}
.s-splash .mk{position:relative;width:72px;height:auto;filter:drop-shadow(0 6px 10px rgba(60,5,10,.35));animation:spMark .6s cubic-bezier(.2,.9,.3,1.4) .45s both}
.s-splash .rip{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(225,29,46,.35);opacity:0;animation:spRip 2.4s cubic-bezier(.2,.7,.3,1) .9s infinite}
.s-splash .rip.r2{animation-delay:1.7s}
.s-splash .halo{position:absolute;inset:-18px;border-radius:50%;background:conic-gradient(from 0deg,rgba(225,29,46,0),rgba(225,29,46,.6),rgba(255,138,128,.1),rgba(225,29,46,0));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));animation:spFade .5s ease 1.1s both,spin 1.6s linear 1.1s infinite}
.s-splash .shadow{width:120px;height:20px;margin-top:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(122,13,23,.3),transparent);animation:spFade .8s ease .4s both}
.s-splash .word{margin:30px 0 0;overflow:hidden;line-height:0}
.s-splash .word img{height:34px;width:auto;animation:spWipe .8s cubic-bezier(.6,0,.2,1) 1.35s both}
.s-splash .tag{margin:10px 0 0;font-size:14px;font-weight:500;color:var(--sub);animation:spFade .6s ease 1.9s both}
.s-splash .load{position:absolute;left:50%;bottom:calc(70px + var(--sb));width:120px;height:4px;margin-left:-60px;border-radius:9px;background:rgba(155,18,32,.12);overflow:hidden;animation:spFade .4s ease 1.9s both}
.s-splash .load i{display:block;height:100%;width:0;border-radius:9px;background:var(--grad);animation:spBar 1s cubic-bezier(.5,0,.3,1) 2s forwards}
.s-splash .ver{position:absolute;left:0;right:0;bottom:calc(36px + var(--sb));text-align:center;font-size:11px;font-weight:500;color:var(--faint);animation:spFade .6s ease 2s both}
@keyframes spOrb{from{opacity:0;transform:scale(.3)}}
@keyframes spMark{from{opacity:0;transform:scale(.4) rotate(-12deg)}}
@keyframes spFade{from{opacity:0}}
@keyframes spRip{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(2.6)}}
@keyframes spWipe{from{clip-path:inset(0 100% 0 0);transform:translateY(40%)}}
@keyframes spBar{to{width:100%}}

/* ===== welcome ===== */
.s-welcome{overflow:hidden;background:#F8F9FB}
.s-welcome .track{position:absolute;left:0;top:0;bottom:calc(200px + var(--sb));display:flex;width:300%;transition:transform .55s cubic-bezier(.3,.8,.3,1);touch-action:pan-y}
.s-welcome .track.drag{transition:none}
.s-welcome .sl{width:33.3334%;display:flex;flex-direction:column;align-items:center;padding:calc(50px + var(--st)) 32px 0}
.s-welcome .card{position:relative;width:min(288px,100%);aspect-ratio:572/767;border-radius:36px;overflow:hidden;flex:none;background:#E9E4E6;box-shadow:0 0 90px 10px rgba(255,90,78,.12),0 30px 50px -34px rgba(60,10,15,.55)}
.s-welcome .card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.s-welcome .sl.on .card img{animation:wcZoom 6s cubic-bezier(.2,.6,.3,1) both}
.s-welcome .copy{margin-top:34px;text-align:center}
.s-welcome .sl .copy>*{opacity:0}
.s-welcome .sl.on .copy>*{opacity:1;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.s-welcome .sl.on .copy>*:nth-child(2){animation-delay:.08s}
.s-welcome .logo{height:38px;width:auto;display:block;margin:30px auto 0}
.s-welcome h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.28}
.s-welcome h1 em{font-style:normal;color:var(--red)}
.s-welcome .copy p{margin:12px auto 0;max-width:300px;font-size:15px;line-height:1.55;color:#4B5563}
.s-welcome .sl:first-child .copy p{margin-top:16px;font-size:14.5px}
.s-welcome .ctl{position:absolute;left:32px;right:32px;bottom:calc(30px + var(--sb))}
.s-welcome .prog{display:flex;align-items:center;justify-content:space-between;margin:0 8px 26px}
.s-welcome .dots{display:flex;gap:7px}
.s-welcome .dots button{width:7px;height:7px;padding:0;border:0;border-radius:99px;background:#CBD2DC;transition:width .35s cubic-bezier(.3,.8,.3,1),background .3s}
.s-welcome .dots button.on{width:28px;background:linear-gradient(90deg,#FF3B2F,#E8263F)}
.s-welcome .step{font-size:13px;font-weight:500;color:#6B7280;font-variant-numeric:tabular-nums}
.s-welcome .go{height:56px;border-radius:24px;background:linear-gradient(90deg,#FF3B2F 0%,#E8263F 55%,#DC1A4B 100%);color:#fff;font-size:17px;gap:12px;overflow:hidden;box-shadow:0 18px 30px -16px rgba(232,38,63,.75)}
.s-welcome .go:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:wcShine 3.2s ease-in-out 1s infinite}
.s-welcome .go svg{stroke-width:2.2}
.s-welcome .alt{display:block;margin:18px auto 0;border:0;background:none;font-size:14px;font-weight:500;color:#4B5563;padding:6px}
.s-welcome .alt b{color:var(--red);font-weight:700;margin-left:2px}
@keyframes wcZoom{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes wcShine{0%,60%{left:-40%}100%{left:130%}}
@media (max-height:780px){.s-welcome .sl{padding-top:calc(28px + var(--st))}.s-welcome .card{width:min(236px,100%)}.s-welcome .copy{margin-top:22px}.s-welcome .logo{margin-top:18px}}
@media (max-height:680px){.s-welcome .card{width:min(190px,100%)}.s-welcome h1{font-size:21px}}

/* ===== sign up / log in / check email / verify ===== */
.s-auth{background:#fff;padding:calc(40px + var(--st)) 24px calc(32px + var(--sb))}
.s-auth>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.s-auth>*:nth-child(2){animation-delay:.04s}.s-auth>*:nth-child(3){animation-delay:.08s}.s-auth>*:nth-child(n+4){animation-delay:.12s}
.s-auth .logo{display:block;height:33px;width:auto;margin-left:4px}
.s-auth h1{margin:36px 0 0;font-size:29px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.s-auth .lead{margin:10px 0 0;font-size:15px;color:var(--sub)}
.s-auth form{margin-top:30px}
.s-auth .f{margin-bottom:18px}
.s-auth label{display:block;font-size:14px;font-weight:600;margin-bottom:9px}
.s-auth .lrow{display:flex;justify-content:space-between;align-items:baseline}
.s-auth .lrow a{font-size:13px;font-weight:600}
.s-auth .in{position:relative;display:flex;align-items:center;height:52px;border:1px solid var(--line);border-radius:18px;background:#fff;transition:border-color .2s,box-shadow .2s}
.s-auth .in:focus-within{border-color:var(--red);box-shadow:0 0 0 4px rgba(225,29,46,.1)}
.s-auth .in input{flex:1;height:100%;min-width:0;border:0;background:none;outline:none;padding:0 16px;font-size:15px}
.s-auth .in input::placeholder{color:#8A7F84}
.s-auth .eye{width:48px;height:48px;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center}
.s-auth .f.bad .in{border-color:var(--err);animation:shake .35s}
.s-auth .hint{margin:9px 0 0;font-size:12.5px;color:var(--sub)}
.s-auth .f.bad .hint{color:var(--err)}
.s-auth .f.good .hint{color:#15803D}
.s-auth .terms{margin:4px 0 18px;font-size:12.5px;line-height:1.5;color:var(--sub)}
.s-auth .btn.o{margin-top:12px}
.s-auth .or{display:flex;align-items:center;gap:12px;margin:22px 0 10px;font-size:13px;color:var(--sub)}
.s-auth .or:before,.s-auth .or:after{content:"";flex:1;height:1px;background:var(--line)}
.s-auth .foot{margin:24px 0 0;text-align:center;font-size:14px;color:var(--sub)}
.s-auth .foot a{font-weight:700;margin-left:6px}
.s-auth .back{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font-size:15px;font-weight:500}
.s-auth .back svg{width:16px;height:16px;stroke-width:2.4}
.s-auth .tile{width:64px;height:64px;margin-top:40px;border-radius:22px;background:#FFF1F2;color:var(--red-t);display:flex;align-items:center;justify-content:center}
.s-auth .tile svg{width:30px;height:30px;stroke-width:2}
.s-auth .tile .flap{transform-origin:50% 20%;animation:auFlap 1.6s ease-in-out .6s 2}
@keyframes auFlap{50%{transform:scaleY(.4)}}
.s-auth .box{margin-top:30px;padding:20px 16px;border-radius:22px;background:#FFF7F7}
.s-auth .box small{display:block;font-size:13px;color:var(--sub)}
.s-auth .box b{display:block;margin:10px 0;font-size:17px;font-weight:700;word-break:break-all}
.s-auth .box p{margin:0;font-size:13px;color:var(--sub)}
.s-auth .mt{margin-top:32px}
.s-auth .link{display:block;margin:22px auto 0;border:0;background:none;font-size:15px;font-weight:500;color:var(--red-t);padding:4px}
.s-auth .note{margin:56px 0 0;text-align:center;font-size:13px;line-height:1.5;color:var(--sub)}
.s-auth .help{margin:48px 0 0;text-align:center;font-size:13px;color:var(--sub)}
.s-auth .help a{color:var(--sub)}
.s-auth .to{margin:8px 0 0;font-size:15px;font-weight:500;word-break:break-all}
.s-auth .otp{display:flex;gap:8px}
.s-auth .otp input{flex:1;min-width:0;height:58px;border:1px solid #E5C9D0;border-radius:16px;text-align:center;font-size:24px;font-weight:500;outline:none;background:#fff;caret-color:var(--red);transition:border-color .2s,box-shadow .2s}
.s-auth .otp input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(225,29,46,.1)}
.s-auth .otp input.fill{border-color:#D8A6B0;animation:auPop .2s ease}
@keyframes auPop{50%{transform:scale(1.08)}}
.s-auth .otp.bad input{border-color:var(--err);animation:shake .35s}
.s-auth .otp.ok input{border-color:#16A34A;background:#F0FDF4;color:#15803D}
.s-auth .exp{margin:12px 0 0;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.s-auth .exp.err{color:var(--err)}
.s-auth .resend{display:block;margin:22px auto 0;border:0;background:none;font-size:15px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums;padding:4px}
.s-auth .resend.on{color:var(--red-t);font-weight:700}
.s-auth .resend+.link{margin-top:14px}
.s-auth .box.tip{margin-top:44px}
.s-auth .box.tip b{margin:0 0 8px;font-size:15px}

/* ===== home ===== */
.s-home{background:radial-gradient(55% 32% at 92% 0%,rgba(255,138,128,.2),transparent 70%),radial-gradient(45% 30% at 0% 46%,rgba(255,138,128,.1),transparent 70%),var(--pink);padding:calc(16px + var(--st)) 20px calc(104px + var(--sb));display:flex;flex-direction:column;overflow:hidden}
.s-home .top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 0}

.s-home .tr{display:flex;align-items:center;gap:10px}
.s-home .av{width:42px;height:42px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:#fff;box-shadow:0 8px 18px -10px rgba(122,13,23,.45)}

/* status chip */

.s-home[data-s=on] .chip i{background:var(--red);box-shadow:0 0 0 4px rgba(225,29,46,.14)}
.s-home[data-s=connecting] .chip i{background:#F59E0B;animation:hmBlink 1s ease-in-out infinite}
@keyframes hmBlink{50%{opacity:.3}}
/* globe */
.s-home .globe{flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;margin:4px -8px}
.s-home .globe svg{height:100%;max-height:340px;width:auto;max-width:100%;overflow:visible}
.s-home .gl-ring{fill:none;stroke:rgba(37,99,235,.16);stroke-width:1}
.s-home .gl-edge{stroke:rgba(80,120,220,.45);stroke-width:1}
.s-home .grat{fill:none;stroke:rgba(60,100,205,.3);stroke-width:.9}
.s-home .arc{fill:none;stroke-width:3;stroke-linecap:round;stroke:#EBB3B8;stroke-dasharray:.015 .025;transition:stroke .3s}
.s-home[data-s=connecting] .arc{stroke:#E8838B;animation:arcFlow .9s linear infinite}
.s-home[data-s=on] .arc{stroke:url(#arcG);stroke-dasharray:1;animation:arcIn 1.1s cubic-bezier(.5,0,.2,1) both}
@keyframes arcFlow{to{stroke-dashoffset:-.08}}
@keyframes arcIn{from{stroke-dashoffset:1}}
.s-home .you{fill:#fff;stroke:var(--red);stroke-width:2.6}
.s-home .dst{fill:#E9A3A9;transition:fill .3s}.s-home .dst-h{fill:rgba(225,29,46,.12)}
.s-home[data-s=on] .dst{fill:var(--red)}
.s-home .dst-p{fill:none;stroke:var(--red);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.s-home[data-s=on] .dst-p{animation:dstPulse 2s ease-out infinite}
@keyframes dstPulse{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.s-home .gl-t{font-size:15px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:rgba(255,245,243,.85);stroke-width:4px;stroke-linejoin:round}
/* bottom card */
.s-home .card{position:relative;z-index:1;padding:18px 18px 18px;border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 26px 44px -30px rgba(122,13,23,.55),0 0 0 1px rgba(155,18,32,.05)}
.s-home .lc{display:flex;align-items:center;gap:14px;width:100%;padding:0;border:0;background:none;text-align:left}
.s-home .lc .flag{width:36px;height:26px;border-radius:5px;flex:none}
.s-home .lc .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.s-home .lc b{font-size:17px;font-weight:700}.s-home .lc small{font-size:13.5px;color:var(--sub)}
.s-home .chg{flex:none;padding:8px 15px;border-radius:99px;background:#FDEBEC;color:var(--red-t);font-size:14px;font-weight:700}
.s-home .tm{display:flex;align-items:center;justify-content:space-between;margin-top:clamp(10px,2vh,18px)}
.s-home .time{font-size:clamp(32px,4.6vh,40px);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
.s-home .tm small{font-size:13.5px;color:var(--sub)}
.s-home .st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:clamp(10px,2vh,16px)}
.s-home .st>*{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid #F3E7E9;border-radius:16px;background:#FFFCFC;text-align:left;min-width:0}
.s-home .st small{font-size:12px;color:var(--sub)}
.s-home .st b{font-size:19px;font-weight:700;white-space:nowrap}.s-home .st b em{font-style:normal;font-size:12px;font-weight:500;color:var(--sub);margin-left:2px}
.s-home .st .low b{color:var(--red-t)}
.s-home .pw{width:100%;height:58px;margin-top:clamp(12px,2.2vh,18px);border:0;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--grad);color:#fff;font-size:17px;font-weight:700;box-shadow:0 18px 28px -16px rgba(179,18,31,.85);transition:background .3s,color .3s}
.s-home .pw svg{width:22px;height:22px;stroke-width:2.2}
.s-home .pw:active{transform:scale(.98)}
.s-home .pw.pop{animation:hmPop .5s ease}
.s-home[data-s=connecting] .pw{background:#fff;color:var(--red-t);box-shadow:inset 0 0 0 1.5px #F2C4C8}
.s-home .pw .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid #F6CDD1;border-top-color:var(--red);animation:spin .8s linear infinite}
@keyframes hmPop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:none}}
@media (max-height:720px){.s-home .chip{padding:6px 14px 6px 12px;font-size:13px}.s-home .card{padding:14px 16px}.s-home .st>*{padding:8px 10px}.s-home .st b{font-size:16px}.s-home .pw{height:50px}}

/* ===== server list ===== */
.s-servers{background:#fff;padding:calc(22px + var(--st)) 20px calc(120px + var(--sb))}
.s-servers .hd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}

.s-servers .smart{margin-top:14px;position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;border-radius:24px;text-align:left;color:#fff;overflow:hidden;background:radial-gradient(circle at 18% 0%,#FF8A80 0%,transparent 55%),linear-gradient(135deg,#B3121F,#E11D2E 60%,#FF5A4E);box-shadow:0 22px 36px -22px rgba(155,18,32,.9),inset 0 1px 0 rgba(255,255,255,.35)}
.s-servers .smart:before{content:"";position:absolute;right:-40px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}

.s-servers .smart .tx{position:relative;flex:1;display:flex;flex-direction:column;gap:3px}
.s-servers .smart .tx small{font-size:12px;font-weight:600;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.s-servers .smart .tx b{font-size:17px}.s-servers .smart .tx span{font-size:13px;opacity:.9}
.s-servers .smart .ok{position:relative;width:36px;height:36px;border-radius:50%;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.s-servers .smart.sel .ok{background:#1C171D;color:#fff}
/* the pill shares the grid cell with the tab, so it always fits it exactly */
.s-servers .seg{display:grid;grid-template-columns:1fr 1fr;margin:14px 0 4px;padding:4px;border-radius:18px;background:#F8EEF0;border:1px solid #F1E2E5}
.s-servers .seg .pill{grid-area:1/1;border-radius:14px;background:linear-gradient(135deg,#E11D2E,#F0505B);box-shadow:0 4px 10px -4px rgba(179,18,31,.55);transition:transform .35s cubic-bezier(.3,.8,.3,1)}
.s-servers .seg[data-v=fav] .pill{transform:translateX(100%)}
.s-servers .seg button{position:relative;grid-row:1;min-width:0;height:44px;padding:0 10px;white-space:nowrap;border:0;background:none;font-size:14px;font-weight:600;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .3s}
.s-servers .seg button[data-v=all]{grid-column:1}.s-servers .seg button[data-v=fav]{grid-column:2}
.s-servers .seg button.on{color:#fff}
.s-servers .seg .n[hidden]{display:none}
.s-servers .seg .n{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:rgba(155,18,32,.12);color:var(--red-d);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.s-servers .seg button.on .n{background:rgba(255,255,255,.25);color:#fff}
.s-servers .lbl{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 14px;font-size:15px;font-weight:700}
.s-servers .lbl span{font-weight:500;font-size:13px;color:var(--sub)}
.s-servers .list{display:flex;flex-direction:column;gap:10px}
.s-servers .ct{border-radius:26px;background:#fff;border:1px solid #EFE3E5;box-shadow:0 10px 22px -22px rgba(122,13,23,.6);animation:rise .4s both;overflow:hidden}
.s-servers .ct-h{display:flex;align-items:center;gap:8px;padding:0 14px;height:68px}
.s-servers .ct-h .flag{width:42px;height:29px;border-radius:6px}
.s-servers .main{flex:1;display:flex;align-items:center;gap:12px;height:100%;border:0;background:none;text-align:left;padding:0;min-width:0}
.s-servers .nm{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.s-servers .nm b{font-size:15px;font-weight:700}.s-servers .nm small{font-size:12px;color:var(--sub)}
.s-servers .ping{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.s-servers .sig{display:flex;align-items:flex-end;gap:2px;height:12px}
.s-servers .sig i{width:3px;border-radius:2px;background:#E8DADC}
.s-servers .sig i:nth-child(1){height:5px}.s-servers .sig i:nth-child(2){height:8px}.s-servers .sig i:nth-child(3){height:12px}
.s-servers .sig.s3 i{background:#16A34A}.s-servers .sig.s2 i:nth-child(-n+2){background:#E5A100}.s-servers .sig.s1 i:nth-child(1){background:var(--red)}
.s-servers .ib{width:36px;height:36px;border:0;border-radius:50%;background:#F7F2F3;display:flex;align-items:center;justify-content:center;color:var(--faint);flex:none}
.s-servers .ib svg{width:20px;height:20px;transition:transform .3s}
.s-servers .fav.on{color:var(--red)}.s-servers .fav.on svg{fill:var(--red)}
.s-servers .fav.pop svg{animation:svPop .4s ease}
.s-servers .ct.open .chev svg{transform:rotate(180deg)}
.s-servers .pro{padding:5px 11px;border-radius:9px;background:#FDEBEC;color:#D31929;font-size:12px;font-weight:800;letter-spacing:.02em}
.s-servers .lk{background:#FDEBEC;color:#D31929}
.s-servers .cities{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.3,.8,.3,1)}
.s-servers .ct.open .cities{grid-template-rows:1fr}
.s-servers .cities>div{overflow:hidden}
.s-servers .city{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:0 8px 6px;height:50px;padding:0 12px 0 16px;border:0;border-radius:16px;background:#FFF5F4;text-align:left;font-size:14px;font-weight:600}

.s-servers .city .cn{flex:1}
.s-servers .city .rd{width:20px;height:20px;border-radius:50%;border:2px solid #E3D3D6;flex:none;transition:.2s}
.s-servers .city.sel{background:linear-gradient(135deg,#FFE6E3,#FFD6D1);color:var(--red-d)}
.s-servers .city.sel .rd{border:6px solid var(--red);box-shadow:0 0 0 4px rgba(225,29,46,.14)}
.s-servers .empty{display:none;flex-direction:column;align-items:center;gap:10px;padding:40px 20px;text-align:center;color:var(--sub);font-size:14px}
.s-servers .empty b{color:var(--ink);font-size:16px}
.s-servers .empty .ic{width:60px;height:60px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--red);box-shadow:0 12px 24px -16px rgba(122,13,23,.6)}
@keyframes svPop{40%{transform:scale(1.35)}}

/* ===== menu ===== */
.s-menu{background:var(--pink);padding:calc(22px + var(--st)) 20px calc(120px + var(--sb))}
.s-menu>*{animation:rise .45s both}
.s-menu>*:nth-child(2){animation-delay:.05s}.s-menu>*:nth-child(3){animation-delay:.1s}.s-menu>*:nth-child(n+4){animation-delay:.15s}
.s-menu h1{margin:6px 0 16px;font-size:28px;font-weight:700;letter-spacing:-.02em}
.s-menu .pro{position:relative;padding:18px;border-radius:28px;color:#fff;overflow:hidden;background:radial-gradient(circle at 15% 0%,#FF8A80 0%,transparent 55%),linear-gradient(140deg,#9B1220,#E11D2E 60%,#FF5A4E);box-shadow:0 26px 40px -26px rgba(155,18,32,.95),inset 0 1px 0 rgba(255,255,255,.35)}
.s-menu .pro:before{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 65%)}

.s-menu .who{position:relative;display:flex;align-items:center;gap:14px}

.s-menu .who .nm span{font-size:13px;opacity:.85}
.s-menu .badge{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.2);font-size:11px;font-weight:700;letter-spacing:.04em}
.s-menu .badge svg{width:13px;height:13px;color:#FFD66B}
.s-menu .exp{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2);font-size:13px}
.s-menu .exp span{opacity:.9;line-height:1.4}.s-menu .exp b{display:block;font-size:15px}
.s-menu .exp button{flex:none;border:0;border-radius:99px;padding:10px 16px;background:#fff;color:var(--red-d);font-size:13px;font-weight:700}
.s-menu .exp .acts{display:flex;gap:8px;opacity:1}
.s-menu .exp button.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.s-menu .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.s-menu .st{padding:12px;border-radius:20px;background:rgba(255,255,255,.82);border:1px solid #fff;box-shadow:0 14px 26px -22px rgba(122,13,23,.55);display:flex;flex-direction:column;gap:6px}

.s-menu .st b{font-size:16px;font-variant-numeric:tabular-nums}

/* account */
.s-account .me{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0 6px;text-align:center}
.s-account .me .av{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;background:radial-gradient(circle at 34% 26%,#FFB1A8,#E11D2E 52%,#9B1220);box-shadow:0 18px 30px -16px rgba(155,18,32,.8);margin-bottom:8px}
.s-account .me b{font-size:20px}.s-account .me span{font-size:14px;color:var(--sub)}
.chipline{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:6px 12px;border-radius:99px;background:#FDEBEC;color:#C70F21;font-size:12px;font-weight:700}
.chipline svg{width:14px;height:14px}
/* premium */
.s-plans .hero{position:relative;margin-top:10px;padding:22px 20px;border-radius:28px;color:#fff;overflow:hidden;background:radial-gradient(circle at 15% 0%,#FF8A80 0%,transparent 55%),linear-gradient(140deg,#9B1220,#E11D2E 60%,#FF5A4E);box-shadow:0 26px 40px -26px rgba(155,18,32,.95)}
.s-plans .hero:before{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 65%)}
.s-plans .crown{position:relative;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFD66B,#F59E0B);color:#7A3E00;box-shadow:0 10px 20px -10px rgba(60,5,10,.6);animation:popIn .6s cubic-bezier(.2,.9,.3,1.4) .15s both}
.s-plans .hero h2{position:relative;margin:14px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.s-plans .hero p{position:relative;margin:0;font-size:14px;line-height:1.5;opacity:.92}
.s-plans .ben .tl{width:30px;height:30px;border-radius:50%}.s-plans .ben .tl svg{width:16px;height:16px;stroke-width:2.6}
.s-plans .ben .row{min-height:52px}
.s-plans .plan{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px;padding:16px;border-radius:20px;border:1.5px solid #F0E3E5;background:#fff;text-align:left;transition:border-color .2s,background .2s}
.s-plans .plan .tx{flex:1;display:flex;flex-direction:column;gap:3px}.s-plans .plan .tx b{font-size:16px}.s-plans .plan .tx small{font-size:12.5px;color:var(--sub)}
.s-plans .plan .pr{text-align:right;font-size:13px;color:var(--sub)}.s-plans .plan .pr b{display:block;font-size:18px;color:var(--ink)}
.s-plans .plan .rd{width:22px;height:22px;border-radius:50%;border:2px solid #E3D3D6;flex:none;transition:.2s}
.s-plans .plan.sel{border-color:var(--red);background:#FFF7F6}.s-plans .plan.sel .rd{border:7px solid var(--red)}
.s-plans .plan .tag{position:absolute;right:16px;top:-10px;padding:3px 10px;border-radius:99px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;letter-spacing:.03em}
.s-plans .cta{position:sticky;bottom:calc(-36px - var(--sb));margin:18px -20px 0;padding:14px 20px calc(20px + var(--sb));background:linear-gradient(180deg,rgba(255,255,255,0),#fff 22%)}
.s-plans .cta small{display:block;margin-top:10px;text-align:center;font-size:12px;color:var(--sub)}
.s-paid{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-left:32px;padding-right:32px}
.s-paid .orb{position:relative;width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:radial-gradient(circle at 34% 26%,#FFB1A8 0%,#FF5A4E 22%,#E11D2E 52%,#9B1220 82%,#6E0A14 100%);box-shadow:inset 0 -16px 34px rgba(60,5,10,.45),inset 0 10px 22px rgba(255,255,255,.35),0 40px 60px -26px rgba(155,18,32,.85);animation:popIn .7s cubic-bezier(.2,.9,.3,1.3) both}
.s-paid .orb svg{width:54px;height:54px;stroke-width:2.4}
.s-paid .orb i{position:absolute;width:8px;height:8px;border-radius:2px;opacity:0;animation:confetti 1.4s ease-out .4s both}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(240deg)}}
.s-paid .btn{flex:none}
.s-paid h1{margin:34px 0 8px;font-size:27px;font-weight:800;letter-spacing:-.02em}
.s-paid p{margin:0;font-size:15px;line-height:1.55;color:var(--sub)}
.s-paid .box{width:100%;margin:26px 0 28px;padding:16px;border-radius:20px;background:#FFF7F7;text-align:left;font-size:13px;color:var(--sub)}
.s-paid .box b{display:block;margin-top:4px;font-size:15px;color:var(--ink)}
/* support */
.s-support .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.s-support .ch{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:22px;border:1px solid #F3E7E9;background:#fff;text-align:left;box-shadow:0 14px 26px -24px rgba(122,13,23,.6)}
.s-support .ch .tl{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--grad)}
.s-support .ch .tl.dk{background:linear-gradient(145deg,#3A3036,#1C171D)}
.s-support .ch b{font-size:15px}.s-support .ch small{font-size:12px;color:var(--sub);margin-top:-6px}
.s-support .ch .on{display:inline-flex;align-items:center;gap:6px}.s-support .ch .on:before{content:"";width:7px;height:7px;border-radius:50%;background:#16A34A}
.faq details{border-top:1px solid #F4E9EA}.faq details:first-child{border-top:0}
.faq summary{display:flex;align-items:center;gap:12px;padding:16px;font-size:15px;font-weight:600;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{margin-left:auto;width:18px;height:18px;color:var(--faint);transition:transform .3s}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq details p{margin:-4px 16px 16px;font-size:14px;line-height:1.55;color:var(--sub)}
.ta{width:100%;min-height:120px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;font:inherit;font-size:15px;resize:vertical;outline:none;margin-bottom:14px}
.ta:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(225,29,46,.1)}
/* chat */
.s-chat{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.s-chat .bar small{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#15803D}
.s-chat .bar small:before{content:"";width:7px;height:7px;border-radius:50%;background:#16A34A}
.s-chat .bar .ttl{flex:1;display:flex;flex-direction:column;gap:2px}.s-chat .bar .ttl h1{flex:none}
.s-chat .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px 0 16px;scrollbar-width:none}
.s-chat .day{align-self:center;font-size:12px;color:var(--faint);margin:4px 0}
.s-chat .m{max-width:80%;padding:11px 14px;border-radius:20px;font-size:14.5px;line-height:1.45;animation:rise .3s both}
.s-chat .m.them{align-self:flex-start;background:#fff;border:1px solid #F3E7E9;border-bottom-left-radius:6px}
.s-chat .m.me{align-self:flex-end;color:#fff;background:var(--grad);border-bottom-right-radius:6px}
.s-chat .typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;border-radius:20px;background:#fff;border:1px solid #F3E7E9}
.s-chat .typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}.s-chat .typing i:nth-child(2){animation-delay:.15s}.s-chat .typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.3}}
.s-chat .quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.s-chat .quick button{flex:none;padding:9px 14px;border-radius:99px;border:1px solid #F1D9DC;background:#fff;color:var(--red-t);font-size:13px;font-weight:600}
.s-chat form{display:flex;gap:10px;margin:0 -20px;padding:12px 16px calc(14px + var(--sb));background:#fff;border-top:1px solid #F3E7E9}
.s-chat form input{flex:1;min-width:0;height:48px;padding:0 16px;border:1px solid var(--line);border-radius:99px;font-size:15px;outline:none}
.s-chat form input:focus{border-color:var(--red)}
.s-chat form button{width:48px;height:48px;border:0;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
/* about + terms */
.s-about .brandbox{display:flex;flex-direction:column;align-items:center;gap:10px;margin:28px 0 22px;text-align:center}
.s-about .brandbox img{height:40px;width:auto}.s-about .brandbox span{font-size:13px;color:var(--sub)}
.s-about .copy{margin:26px 0 0;text-align:center;font-size:12px;color:var(--faint)}
.s-terms .tabs2{display:grid;grid-template-columns:1fr 1fr;margin:10px 0 6px;padding:4px;border-radius:18px;background:#F8EEF0;border:1px solid #F1E2E5}
.s-terms .tabs2 span{grid-area:1/1;border-radius:14px;background:linear-gradient(135deg,#E11D2E,#F0505B);transition:transform .35s cubic-bezier(.3,.8,.3,1)}
.s-terms .tabs2[data-v=privacy] span{transform:translateX(100%)}
.s-terms .tabs2 button{grid-row:1;position:relative;height:42px;border:0;background:none;font-size:14px;font-weight:600;color:var(--sub);transition:color .3s}
.s-terms .tabs2 button:nth-of-type(1){grid-column:1}.s-terms .tabs2 button:nth-of-type(2){grid-column:2}
.s-terms .tabs2 button.on{color:#fff}
.s-terms article h2{margin:22px 4px 8px;font-size:16px;font-weight:700}
.s-terms article p{margin:0 4px;font-size:14px;line-height:1.65;color:#4B4247}
.s-terms .upd{margin:14px 4px 0;font-size:12px;color:var(--faint)}

/* snackbar with an action */
.snack{position:absolute;left:16px;right:16px;bottom:calc(24px + var(--sb));z-index:21;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:18px;background:#1C171D;color:#fff;box-shadow:0 18px 30px -16px rgba(23,18,26,.6);transform:translateY(16px);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.3,.8,.3,1)}
#app.tabs .snack{bottom:calc(104px + var(--sb))}
.snack.show{transform:none;opacity:1;pointer-events:auto}
.snack .sic{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12)}
.snack .sic svg{width:17px;height:17px}
.snack.warn .sic{background:#F59E0B;color:#1C171D}
.snack p{flex:1;margin:0;font-size:13px;line-height:1.4}
.snack button{flex:none;border:0;border-radius:99px;padding:9px 14px;background:#fff;color:var(--red-t);font-size:13px;font-weight:700}
/* limit popup */
.lim{text-align:center}
.lim-ic{width:64px;height:64px;margin:0 auto 14px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:#FFF1F2;color:var(--red-t)}
.lim-ic svg{width:30px;height:30px}
.lim p b{color:var(--ink)}
.lim-bar{height:8px;margin:4px 0 8px;border-radius:9px;background:#F3E7E9;overflow:hidden}
.lim-bar i{display:block;height:100%;border-radius:9px;background:var(--grad)}
.lim small{display:block;margin-bottom:18px;font-size:12px;color:var(--sub)}
.lim .btns{gap:10px}.lim .btn{flex:none}
/* coach marks: first-run tour of Home */
.coach{position:absolute;inset:0;z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.coach.show{opacity:1;pointer-events:auto}
.cm-hole{position:absolute;border-radius:24px;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 9999px rgba(23,18,26,.62);transition:left .45s cubic-bezier(.3,.8,.3,1),top .45s cubic-bezier(.3,.8,.3,1),width .45s cubic-bezier(.3,.8,.3,1),height .45s cubic-bezier(.3,.8,.3,1),border-radius .45s}
.cm-hole:after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid #FF8A80;animation:cmPulse 1.8s ease-out infinite}
@keyframes cmPulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
.cm-tip{position:absolute;left:16px;width:min(300px,calc(100% - 32px));padding:18px 18px 14px;border-radius:22px;background:#fff;box-shadow:0 24px 40px -20px rgba(23,18,26,.55);transition:top .45s cubic-bezier(.3,.8,.3,1),left .45s cubic-bezier(.3,.8,.3,1)}
.cm-tip:before{content:"";position:absolute;left:var(--ax,50%);width:14px;height:14px;margin-left:-7px;background:#fff;border-radius:3px;transform:rotate(45deg)}
.cm-tip.below:before{top:-6px}.cm-tip.above:before{bottom:-6px}
.cm-tip .cm-in{animation:cmIn .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes cmIn{from{opacity:0;transform:translateY(6px)}}
.cm-tip small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--red-t)}
.cm-tip h3{margin:6px 0 0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.cm-tip p{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--sub)}
.cm-ft{display:flex;align-items:center;gap:8px;margin-top:14px}
.cm-dots{display:flex;gap:5px;flex:1}
.cm-dots i{width:6px;height:6px;border-radius:9px;background:#EAD9DC;transition:width .3s,background .3s}
.cm-dots i.on{width:18px;background:var(--red)}
.cm-skip{border:0;background:none;padding:9px 10px;font-size:13px;font-weight:600;color:var(--sub)}
.cm-next:focus-visible{outline:2px solid rgba(225,29,46,.35);outline-offset:2px}
.cm-next{border:0;border-radius:99px;padding:10px 18px;background:var(--grad);color:#fff;font-size:13.5px;font-weight:700;box-shadow:0 10px 18px -10px rgba(179,18,31,.9)}
/* home: daily data strip */
/* manage plan list */
.s-plans .plist{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.s-plans .pl{border-radius:20px;border:1.5px solid #E9E1E3;background:#fff;transition:border-color .2s,background .2s,box-shadow .2s}
.s-plans .pl.sel{border-color:var(--red);background:#FFF5F5;box-shadow:0 14px 26px -22px rgba(179,18,31,.7)}
.s-plans .pl-h{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:0;background:none;text-align:left}
.s-plans .pl-h .rd{width:22px;height:22px;border-radius:50%;border:2px solid #B9AEB2;flex:none;transition:.2s}
.s-plans .pl.sel .pl-h .rd{border:6px solid var(--red);box-shadow:inset 0 0 0 2px #fff}
.s-plans .pl-h .tx{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.s-plans .pl-h small{font-size:12.5px;color:var(--sub)}
.s-plans .pl.sel .pl-h small{color:var(--red-t)}
.s-plans .pl-h b{font-size:23px;font-weight:800;letter-spacing:-.02em}
.s-plans .pl.sel .pl-h b{color:var(--red-t)}
.s-plans .pl-h b s{margin-right:8px;font-size:15px;font-weight:500;color:var(--faint)}
.s-plans .pl-h em{font-style:normal;font-size:12.5px;color:var(--sub)}
.s-plans .pl-h em.tr{display:flex;align-items:center;gap:6px;margin-top:3px;color:#16A34A;font-weight:600}
.s-plans .pl-h em.tr svg{width:15px;height:15px;color:#16A34A}
.s-plans .pl-h>svg{width:18px;height:18px;color:var(--sub);transition:transform .3s}
.s-plans .pl.open .pl-h>svg{transform:rotate(180deg)}
.s-plans .tag{flex:none;padding:5px 11px;border-radius:99px;background:var(--red-t);color:#fff;font-size:11px;font-weight:800;letter-spacing:.03em}
.s-plans .tag.cur{background:#EEF0F3;color:#64748B}
.s-plans .tag.ol{background:#fff;color:var(--red-t);box-shadow:inset 0 0 0 1.5px var(--red-t)}
.s-plans .pl .fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.3,.8,.3,1)}
.s-plans .pl.open .fold{grid-template-rows:1fr}.s-plans .pl .fold>div{overflow:hidden}
.s-plans .pl ul{list-style:none;margin:0 16px;padding:12px 0 14px;border-top:1px solid #F4DADD;display:flex;flex-direction:column;gap:9px}
.s-plans .pl li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#3F3A3D}
.s-plans .pl li svg{width:16px;height:16px;color:#16A34A;stroke-width:2.6}
.s-plans .cta .btn:disabled{background:#EEE7E8;color:var(--sub);box-shadow:none}
.s-plans .cta .btn svg{width:20px;height:20px}
/* checkout */
.s-checkout .sum{margin:6px 0 22px;padding:18px 22px;border-radius:24px;border:1px solid #E7E0E2;background:#fff}
.s-checkout .ln{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;font-weight:500}
.s-checkout .ln b{font-size:20px;font-weight:800}
.s-checkout .ln.sm{margin-top:6px;font-size:13px;color:var(--sub)}
.s-checkout .ln.tot{margin-top:16px;padding-top:16px;border-top:1px solid #EEE7E8;font-size:18px;font-weight:700}
.s-checkout .pay{display:flex;align-items:center;gap:12px;margin:0 0 26px 10px}
.s-checkout .pay .rd{width:22px;height:22px;border-radius:50%;border:6px solid var(--red);box-shadow:inset 0 0 0 2px #fff,0 0 0 1px var(--red);margin-right:16px;flex:none}
.s-checkout .pm{width:56px;height:34px;border:1.5px solid transparent;border-radius:8px;background:#E7EBF8;display:flex;align-items:center;justify-content:center;transition:border-color .2s,transform .2s}
.s-checkout .pm.sel{border-color:var(--red);background:#fff;transform:translateY(-1px);box-shadow:0 8px 16px -10px rgba(179,18,31,.6)}
.s-checkout .paynow{position:relative;display:flex;align-items:center;width:100%;height:58px;padding:0 8px 0 30px;border:0;border-radius:99px;background:#E12A33;color:#fff;font-size:18px;font-weight:700;box-shadow:0 16px 26px -16px rgba(179,18,31,.9)}
.s-checkout .paynow span{flex:1;text-align:left}
.s-checkout .paynow i{width:44px;height:44px;border-radius:50%;background:#fff;color:#E12A33;display:flex;align-items:center;justify-content:center;padding-left:3px;transition:transform .4s}
.s-checkout .paynow:active{transform:scale(.98)}
.s-checkout .paynow.busy i{animation:spin 1s linear infinite;padding:0;border:3px solid #fff;border-top-color:transparent;background:none}
.s-checkout .paynow.busy i svg{display:none}
.s-checkout .secure{display:flex;gap:12px;margin-top:40px;padding:16px 18px;border-radius:16px;background:#F1F3F6;border:1px solid #E3E7EC}
.s-checkout .secure>svg{margin-top:12px;color:#64748B}
.s-checkout .secure b{font-size:14px}
.s-checkout .secure p{margin:4px 0 0;font-size:13px;line-height:1.5;color:#64748B}

/* ===== responsive ===== */
.nv-logo,.nv-ft,.pane,.wm,.s-home .hl{display:none}
.s-menu .m-side,.s-menu .m-main{display:contents}
.s-menu :is(.m-side,.m-main)>*{animation:rise .45s both}
@media (min-width:900px){.s-menu>*{animation:none}}
/* tablet: the phone column floats on a soft backdrop */
@media (min-width:481px) and (max-width:899px){
  #app{box-shadow:0 0 0 1px #EADFE1,0 40px 90px -50px rgba(122,13,23,.45)}
  .s-home .globe svg{max-height:440px}}
/* desktop + Mac: a dotted world map is the backdrop, a floating pill navbar on top, content floats over the map */
@media (min-width:900px){
  #app{--side:max(40px,calc((100% - 1200px)/2));max-width:none;background:#FFF7F6}
  body{background:#FFF7F6}
  #app:after{display:none}
  .scr{scrollbar-width:thin;scrollbar-color:#EBCBCF transparent}
  .scr::-webkit-scrollbar{display:block;width:10px}
  .scr::-webkit-scrollbar-thumb{background:#EBD3D6;border-radius:9px;border:3px solid transparent;background-clip:padding-box}
  :is(.s-home,.s-servers,.s-menu,.s-sub,.s-auth,.s-welcome){background:transparent}

  /* world map backdrop */
  .wm{display:block;position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .5s,filter .5s;
    background:radial-gradient(42% 55% at 70% 42%,rgba(255,138,128,.26),transparent 70%),radial-gradient(30% 40% at 8% 96%,rgba(255,90,78,.12),transparent 70%),radial-gradient(26% 30% at 96% 4%,rgba(255,170,160,.18),transparent 70%)}
  .wm svg{display:block;width:100%;height:100%}
  .wm-l{fill:url(#wmL);stroke:#C6D6F6;stroke-width:1.2;stroke-linejoin:round}
  .wm:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#FFF7F6 0,rgba(255,247,246,.82) calc(var(--side) + 300px),rgba(255,247,246,0) calc(var(--side) + 620px)),linear-gradient(180deg,#FFF7F6 0,rgba(255,247,246,0) 130px)}
  #app:not([data-scr=home]):not(.auth) .wm{opacity:.42;filter:saturate(.8)}
  #app[data-scr=splash] .wm{opacity:0}
  .wm .pin .c{fill:#CDBFC2}
  .wm .pin .p{fill:#fff;stroke:#E6D7DA;stroke-width:1.5}

/* ===== blue accents, matched to the landing page =====
   One rule everywhere: red is every action; dark surfaces are navy with a faint red glow;
   red cards carry a faint blue glow in the opposite corner; read-only info sits on a soft

:root{--navy:#0D1E3C;--navy-2:#152A52;--blue:#2563EB;--blue-t:#1D4ED8;--blue-tint:#EEF3FF;--blue-line:#DCE5FB;

.s-menu .pro .av{color:var(--blue-t)}
.s-servers .smart{background:var(--navy-card);box-shadow:0 22px 36px -22px rgba(13,30,60,.9),inset 0 1px 0 rgba(255,255,255,.2)}
.s-servers .smart .bolt{background:rgba(255,255,255,.14);color:#FFD66B}
/* read-only info → soft blue */
.s-home .st>*{background:#F5F8FF;border-color:var(--blue-line)}
.s-menu .st svg{color:var(--blue)}
.s-menu .st{background:linear-gradient(160deg,rgba(238,243,255,.95),rgba(255,255,255,.9))}
/* Premium → blue */
.s-servers .pro{background:var(--blue-tint);color:var(--blue-t)}
.s-servers .lk{background:var(--blue-tint);color:var(--blue-t)}
.s-menu .badge svg,.chipline svg{color:#FFD66B}
.s-plans .tag.ol{color:var(--blue-t);box-shadow:inset 0 0 0 1.5px var(--blue-t)}
/* "You" is blue on the globe; the route runs blue → red */
.s-home .you{stroke:var(--blue)}
/* backgrounds pick up a cool glow next to the blush */
.s-home{background:radial-gradient(55% 32% at 92% 0%,rgba(255,138,128,.18),transparent 70%),radial-gradient(60% 34% at 0% 40%,rgba(96,140,255,.2),transparent 70%),radial-gradient(50% 30% at 100% 70%,rgba(96,140,255,.12),transparent 70%),var(--pink)}

    $('#coach').classList.add('show');this.paint();addEventListener('resize',this.onResize)},
  paint(){const s=this.steps[this.k],t=$(s.el);if(!t)return this.end();
    const a=app.getBoundingClientRect(),b=t.getBoundingClientRect(),hole=$('.cm-hole'),tip=$('.cm-tip');
    let x=b.left-a.left-s.pad,y=b.top-a.top-s.pad,w=b.width+s.pad*2,h=b.height+s.pad*2;

/* ================= router: one page, screens swap in place ================= */
const view=$('#view'),nav=$('#nav'),TABS=['home','servers','menu'],AUTH=['welcome','signup','login','check','verify','forgot'];
const SUBS=['account','plans','checkout','paid','connection','notif','support','chat','about','terms'];
let cur=null,timers=[],depth=0;
const T={every:(f,ms)=>{const id=setInterval(f,ms);timers.push(()=>clearInterval(id))},after:(f,ms)=>{const id=setTimeout(f,ms);timers.push(()=>clearTimeout(id))}};
function go(name,params={},mode='push'){
  if(TABS.includes(name)&&!user)name='welcome';            // signed out → start of the flow
  if(AUTH.includes(name)&&user&&!user.guest)name='home';     // already signed in → skip auth
  if(['account','paid','checkout'].includes(name)&&(!user||user.guest))name=user?'menu':'welcome';
  if(['connection','notif','support','chat','about','terms','plans'].includes(name)&&!user)name='welcome';
  timers.forEach(f=>f());timers=[];closeSheet(true);coach.end(true);VPN.subs.clear();
  const S=SCREENS[name],wasTab=cur&&TABS.includes(cur.name),isTab=TABS.includes(name);
  const el=document.createElement('section');
  el.className=`scr s-${name}${S.cls?' '+S.cls:''}${isTab&&wasTab?' tab':''}`;
  el.innerHTML=S.html(params);
  const old=view.firstElementChild;
  if(old){$$('.scr',view).forEach(o=>{o.classList.add('out');setTimeout(()=>o.remove(),260)})}
  view.appendChild(el);
  // nav: slides the notch between tabs, rises in when the tabs first appear
  // desktop: signed-in pages keep the top navbar (sub pages light up Menu); welcome + auth get the brand story
  const side=isTab||SUBS.includes(name);
  app.classList.toggle('tabs',isTab);app.classList.toggle('side',side);app.classList.toggle('auth',AUTH.includes(name));
  app.dataset.scr=name;paintMap();
  app.style.setProperty('--fade',S.fade||'#fff');
  if(side){const tab=isTab?name:'menu',k=TABS.indexOf(tab);if(!wasTab)nav.classList.add('still');
    nav.style.setProperty('--x',((k+.5)/3*100).toFixed(3)+'%');
    paintRail();
    $$('button[data-tab]',nav).forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);b.toggleAttribute('aria-current',on)});
    requestAnimationFrame(()=>requestAnimationFrame(()=>nav.classList.remove('still')))}
  nav.hidden=!isTab;
  cur={name,params};
  if(mode==='push'){history.pushState(cur,'');depth++}else if(mode==='replace')history.replaceState(cur,'');
  document.title=S.title?S.title+' · RusnetVPN':'RusnetVPN';
  S.init&&S.init(el,params);
}
addEventListener('popstate',e=>{depth=Math.max(0,depth-1);const s=e.state;if(s&&s.name!=='splash')go(s.name,s.params,'none')});
const back=parent=>depth>0?history.back():go(parent,{},'replace');

// desktop navbar, right side: Premium button for limited plans + who is signed in
function paintRail(){const g=!user||user.guest,up=$('.nv-up',nav);up.hidden=!limited();
  if(limited())up.innerHTML=`<button type="button" class="gp">${ic('crown')}${g?'Log in for Premium':'Go Premium'}</button>`;
  $('.nv-me',nav).innerHTML=`<span class="av">${g?ic('user'):esc(initial())}</span><span><b>${g?'Guest':esc(user.name||user.email)}</b><small>${isPrem()?'Premium':g?'1 GB per day':'Free plan'}</small></span>${ic('chev')}`;
  $('.nv-pop',nav).innerHTML=(g?`<button type="button" data-p="login">${ic('user')}Log in or sign up</button>`
    :`<div class="pp-who"><b>${esc(user.name||'')}</b><small>${esc(user.email||'')}</small></div><button type="button" data-p="account">${ic('user')}Account</button><button type="button" data-p="plans">${ic('crown')}My subscription</button>`)+
    `<button type="button" data-p="settings">${ic('sliders')}Settings</button><hr><button type="button" class="pp-out" data-p="out">${ic('logout')}${g?'Exit guest mode':'Log out'}</button>`;
  pop(false)}
// profile dropdown (desktop navbar)
const pop=open=>{const p=$('.nv-pop',nav),b=$('.nv-me',nav);p.hidden=!open;b.setAttribute('aria-expanded',open);if(open)$('button',p)?.focus()};
nav.addEventListener('click',e=>{if(e.target.closest('.gp')){const g=!user||user.guest;g?(setUser(null),go('login')):go('plans');return}
  if(e.target.closest('.nv-me')){pop($('.nv-pop',nav).hidden);return}

    const fillFrom=(k,d)=>{for(const c of d){if(k>5)break;ins[k].value=c;ins[k].classList.add('fill');k++}ins[Math.min(k,5)].focus();box.classList.remove('bad');if(code().length===6)submit()};

<p class="lbl">Protection</p>
<div class="card">${swRow('kill','power','Kill switch','Block internet if VPN drops')}${swRow('auto','wifi','Auto-connect','On public Wi-Fi networks')}${swRow('start','rocket','Connect on app start','Turn the VPN on when you open RusnetVPN')}</div>
<p class="lbl">DNS server</p>
<div class="card">${Object.entries(DNS).map(([k,[n,d]])=>`<button class="row js-dns" role="radio" data-d="${k}"><span class="tl">${ic('dns')}</span><span class="tx"><b>${n}</b><small>${d}</small></span><span class="rd"></span></button>`).join('')}</div>
<p class="lbl">Split tunneling</p>
<div class="card">${swRow('split','split','Split tunneling','Let chosen apps skip the VPN')}
  <div class="fold"><div>${APPS.map(([k,n,c])=>`<button class="row app js-app" role="switch" data-app="${k}"><span class="tl" style="background:${c}">${n[0]}</span><span class="tx"><b>${n}</b><small>Bypass VPN</small></span><span class="sw"></span></button>`).join('')}</div></div></div>
<p class="fine">Apps that skip the VPN use your normal connection and IP address.</p>`,
  init(r){wire(r);
    const paint=()=>{$$('.js-sw',r).forEach(b=>b.setAttribute('aria-checked',!!opts[b.dataset.k]));$$('.js-dns',r).forEach(b=>b.setAttribute('aria-checked',b.dataset.d===opts.dns));
      $('.fold',r).classList.toggle('open',!!opts.split);$$('.js-app',r).forEach(b=>{b.setAttribute('aria-checked',!!opts.apps[b.dataset.app]);b.tabIndex=opts.split?0:-1})};
    paint();
    $$('.js-sw',r).forEach(b=>b.addEventListener('click',()=>{opts[b.dataset.k]=!opts[b.dataset.k];saveOpts();paint()}));
    $$('.js-dns',r).forEach(b=>b.addEventListener('click',()=>{opts.dns=b.dataset.d;saveOpts();paint();toast('DNS: '+DNS[opts.dns][0])}));
    $$('.js-app',r).forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.app;opts.apps[k]=!opts.apps[k];saveOpts();paint()}))}};

/* -------- notifications -------- */
const NOTIF=[['status','shieldOk','Connection status','When the VPN connects or drops'],['security','lock','Security alerts','Unsafe Wi-Fi and leaks'],['data','dl','Data usage','When you near your daily limit'],['servers','globe','New servers','When locations are added'],['offers','star','Offers & promotions','Deals on Premium plans']];
SCREENS.notif={title:'Notifications',cls:'s-sub',html:()=>`
${bar('Notifications')}
<p class="intro">Choose which alerts RusnetVPN can send you.</p>
<p class="lbl">Alerts</p>
<div class="card">${NOTIF.map(([k,i,t,s])=>`<button class="row js-n" role="switch" data-n="${k}"><span class="tl">${ic(i)}</span><span class="tx"><b>${t}</b><small>${s}</small></span><span class="sw"></span></button>`).join('')}</div>`,
  init(r){wire(r);const paint=()=>$$('.js-n',r).forEach(b=>b.setAttribute('aria-checked',!!opts.notif[b.dataset.n]));paint();
    $$('.js-n',r).forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.n;opts.notif[k]=!opts.notif[k];saveOpts();paint()}))}};

/* -------- support + live chat -------- */
const FAQ=[['Why is my connection slow?','Try the Fastest server or a location close to you. Switching protocol to WireGuard in Menu › Protocol usually helps too.'],
  ['Does RusnetVPN keep logs?','No. We never track, store or share what you do online. Only your account email is kept for billing.'],
  ['How many devices can I use?','The free plan covers 3 devices with 1 GB a day. Premium covers up to 5 devices with unlimited data.'],
  ['What does the kill switch do?','If the VPN drops, the kill switch blocks internet traffic until it reconnects, so your real IP is never exposed.'],
  ['How do I cancel Premium?','Open Menu › My subscription and tap Cancel subscription. You keep Premium until the end of the paid period.']];
SCREENS.support={title:'Support center',cls:'s-sub',html:()=>`
${bar('Support center')}
<p class="intro">We’re here 24/7. Most questions are answered below.</p>
<div class="two"><button class="ch js-chat"><span class="tl">${ic('chat')}</span><b>Live chat</b><small class="on">Online · ~2 min</small></button><button class="ch js-email"><span class="tl dk">${ic('mail')}</span><b>Email us</b><small>Reply within 24 h</small></button></div>
<p class="lbl">Frequently asked</p>
<div class="card faq">${FAQ.map(([q,a])=>`<details><summary>${q}${ic('chev')}</summary><p>${a}</p></details>`).join('')}</div>`,
  init(r){wire(r);$('.js-chat',r).addEventListener('click',()=>go('chat'));
    $('.js-email',r).addEventListener('click',()=>{openSheet(`<h2 id="shT">Email support</h2><p>Tell us what’s going on and we’ll reply to ${esc(user&&user.email||'your email')}.</p><textarea class="ta" placeholder="Describe your issue…" aria-label="Message"></textarea><div class="btns"><button class="btn p js-send">Send message</button></div>`);
      setTimeout(()=>$('#sheet textarea').focus(),380);
      $('#sheet .js-send').addEventListener('click',e=>{if($('#sheet textarea').value.trim().length<5){toast('Please write a little more');return}busy(e.currentTarget);setTimeout(()=>{closeSheet(true);toast('Message sent. We’ll reply soon')},900)})})}};

const BOT=[[/slow|speed|lag/i,'Sorry about that! Try tapping “Fastest server” in the Server List, or switch the protocol to WireGuard in Menu › Protocol.'],
  [/log|privacy|track/i,'We run a strict no-logs policy. Your browsing is never stored or shared.'],
  [/premium|price|pay|plan|cancel/i,'Premium starts at $4.99/month on the 12-month plan. You can upgrade or cancel any time in Menu › My subscription.'],
  [/connect|not working|fail/i,'Please check your internet, then try another server. If it still fails, turn the kill switch off and on again.']];
SCREENS.chat={title:'Live chat',cls:'s-sub s-chat',html:()=>`
<div class="bar"><button class="bk js-bk" aria-label="Back">${ic('left')}</button><div class="ttl"><h1>Live chat</h1><small>Rusnet Support · Online</small></div></div>
<div class="msgs" aria-live="polite"><span class="day">Today</span><div class="m them">Hi${firstName()?' '+esc(firstName()):''}! 👋 I’m Rina from RusnetVPN Support. How can I help you today?</div></div>
<div class="quick">${['Connection is slow','Do you keep logs?','Premium price','Can’t connect'].map(q=>`<button>${q}</button>`).join('')}</div>
<form><input placeholder="Type a message…" aria-label="Message" autocomplete="off"><button type="submit" aria-label="Send">${ic('send','width:20px;height:20px')}</button></form>`,
  init(r){wire(r,'support');const box=$('.msgs',r),inp=$('form input',r);
    const add=(t,who)=>{box.insertAdjacentHTML('beforeend',`<div class="m ${who}">${esc(t)}</div>`);box.scrollTop=box.scrollHeight};
    const send=t=>{t=t.trim();if(!t)return;add(t,'me');inp.value='';
      box.insertAdjacentHTML('beforeend','<div class="typing" aria-label="Support is typing"><i></i><i></i><i></i></div>');box.scrollTop=box.scrollHeight;
      T.after(()=>{$('.typing',box)?.remove();add((BOT.find(([re])=>re.test(t))||[0,'Thanks! A support agent will look into this and reply here shortly.'])[1],'them')},1300)};
    $('form',r).addEventListener('submit',e=>{e.preventDefault();send(inp.value)});
    $$('.quick button',r).forEach(b=>b.addEventListener('click',()=>send(b.textContent)))}};

SCREENS.about={title:'About us',cls:'s-sub',html:()=>`
${bar('About us')}
<div class="brandbox"><img src="img/rusnet-logo-light.png?v=3" alt="RusnetVPN"><span>Version 1.2.0 (build 1206)</span></div>
<p class="intro" style="text-align:center">RusnetVPN keeps your connection private and fast, with servers in 110+ locations and a strict no-logs policy.</p>
<p class="lbl">More</p>
<div class="card">
  ${mrow('star','Rate RusnetVPN','Tell us how we’re doing','data-a="rate"')}
  ${mrow('globe','Visit our website','rusnetvpn.com','data-a="soon"')}
  ${mrow('doc','Open-source licenses','','data-a="soon"')}
  ${mrow('lock','Terms &amp; Privacy Policy','','data-go="terms"')}
</div>
<p class="copy">© 2026 RusnetVPN. All rights reserved.</p>`,
  init(r){wire(r);$('[data-go]',r).addEventListener('click',()=>go('terms'));
    $$('[data-a=soon]',r).forEach(b=>b.addEventListener('click',()=>toast($('b',b).textContent+' (contoh)')));
    $('[data-a=rate]',r).addEventListener('click',()=>{openSheet(`<h2 id="shT">Enjoying RusnetVPN?</h2><p>Tap a star to rate us.</p><div class="btns" style="justify-content:center;gap:6px;margin-bottom:8px">${[1,2,3,4,5].map(n=>`<button class="js-star" data-n="${n}" aria-label="${n} star${n>1?'s':''}" style="border:0;background:none;color:#E8DCDE;padding:4px">${ic('star','width:38px;height:38px;fill:currentColor;stroke:none')}</button>`).join('')}</div>`);
      $$('#sheet .js-star').forEach(b=>b.addEventListener('click',()=>{const n=+b.dataset.n;$$('#sheet .js-star').forEach(x=>x.style.color=+x.dataset.n<=n?'#F5A623':'#E8DCDE');setTimeout(()=>{closeSheet();toast(n>=4?'Thank you for the love! ❤️':'Thanks, we’ll keep improving')},600)}))})}};

const TERMS={terms:[['1. Using RusnetVPN','By creating an account you agree to use RusnetVPN only for lawful purposes and not to interfere with our network or other users.'],
  ['2. Your account','You are responsible for keeping your password safe. Tell us right away if you think someone else has accessed your account.'],
  ['3. Subscriptions','Premium renews automatically at the end of each period until you cancel. You can cancel any time; access continues until the paid period ends.'],
  ['4. Refunds','New Premium subscriptions come with a 30-day money-back guarantee.'],
  ['5. Changes','We may update these terms. We’ll let you know in the app before important changes take effect.']],
 privacy:[['What we collect','Only what’s needed to run your account: your email, plan and payment status. We do not log browsing activity, DNS queries or traffic.'],
  ['How we use it','To sign you in, process payments and send the alerts you choose in Notifications.'],
  ['Sharing','We never sell your data. Payments are handled by our payment partners.'],
  ['Your choices','You can update your profile or delete your account at any time in Menu › Account.'],
  ['Contact','Questions? Reach our privacy team through the Support center.']]};
SCREENS.terms={title:'Terms & Privacy',cls:'s-sub',html:()=>`
${bar('Terms &amp; Privacy')}
<div class="tabs2" data-v="terms" role="tablist"><span></span><button class="on" data-v="terms" role="tab" aria-selected="true">Terms of Service</button><button data-v="privacy" role="tab" aria-selected="false">Privacy Policy</button></div>
<article></article>
<p class="upd">Last update: 12 June 2026</p>`,
  init(r,p){wire(r);const tabs=$('.tabs2',r);
    const show=v=>{tabs.dataset.v=v;$$('button',tabs).forEach(b=>{b.classList.toggle('on',b.dataset.v===v);b.setAttribute('aria-selected',b.dataset.v===v)});
      $('article',r).innerHTML=TERMS[v].map(([h,t])=>`<h2>${h}</h2><p>${t}</p>`).join('')};
    $$('button',tabs).forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));show(p.tab||'terms')}};

SCREENS.forgot={title:'Reset password',cls:'s-auth',html:p=>`
${LOGO}
<div><a class="back js-back">${ic('left')}Back to log in</a></div>
<div class="tile" aria-hidden="true">${ic('key')}</div>
<h1 style="margin-top:28px">Reset your password</h1>
<p class="lead">Enter your email and we’ll send you a link to reset it.</p>
<div class="js-step">
<form novalidate>${field('email','<label for="email">Email</label>',`type="email" inputmode="email" autocomplete="email" placeholder="Enter your email" value="${esc(p.email||'')}"`)}<button class="btn p" type="submit">Send reset link</button></form>
</div>
${helpLine}`,
  init(r,p){$('.js-back',r).addEventListener('click',()=>back('login'));$('.js-help',r).addEventListener('click',()=>go('support'));
    const ok=formKit(r,['email']);
    $('form',r).addEventListener('submit',e=>{e.preventDefault();if(!ok())return;const email=$('#email',r).value.trim();busy($('[type=submit]',r));
      T.after(()=>{$('.js-step',r).innerHTML=`<div class="box" style="margin-top:28px"><small>Reset link sent to</small><b>${esc(email)}</b><p>Open the email and follow the link. It expires in 30 minutes.</p></div><button class="btn p mt js-done">Back to log in</button><button class="link js-again">Didn’t get it? Send again</button>`;
        $('.js-done',r).addEventListener('click',()=>go('login',{email},'replace'));$('.js-again',r).addEventListener('click',()=>toast('Reset link sent again'))},900)})}};
